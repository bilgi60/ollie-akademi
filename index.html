<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ollie Akademi</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: online-classroom shell — sidebar nav (bottom tab bar on phones) + main column: Ollie's speech strip, then the page (dashboard, units, unit, dictionary, badges, profile) or the lesson player. */
:root{
  --bg:#EDF4E8; --surface:#FFFFFF; --soft:#F7F1E4; --ink:#22304A; --muted:#5E6A7C; --line:#D6E2D0;
  --accent:#E8742A; --accent-2:#C95E18; --on-accent:#FFFFFF;
  --sun:#FFC43B; --leaf:#2C9A66; --leaf-soft:#DDF3E7; --berry:#D2486A; --berry-soft:#FBE3E9; --sky:#3B7DDD; --sky-soft:#E1ECFB;
  --owl:#9B6338; --owl-dark:#6E4423; --belly:#F4DAB0; --eye:#FFFFFF; --pupil:#22304A; --beak:#FFB627;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121933; --surface:#1C2546; --soft:#232E57; --ink:#F1F3FA; --muted:#A9B3CD; --line:#2F3A66;
  --accent:#FF9149; --accent-2:#FFAA70; --on-accent:#1A1206;
  --sun:#FFD15A; --leaf:#4CC58D; --leaf-soft:#1C3B3A; --berry:#FF7C98; --berry-soft:#3D2340; --sky:#7FB0FF; --sky-soft:#22305E;
  --owl:#B87A4B; --owl-dark:#8A5530; --belly:#F1D6A9; --eye:#FFFFFF; --pupil:#121933; --beak:#FFC43B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121933; --surface:#1C2546; --soft:#232E57; --ink:#F1F3FA; --muted:#A9B3CD; --line:#2F3A66;
  --accent:#FF9149; --accent-2:#FFAA70; --on-accent:#1A1206;
  --sun:#FFD15A; --leaf:#4CC58D; --leaf-soft:#1C3B3A; --berry:#FF7C98; --berry-soft:#3D2340; --sky:#7FB0FF; --sky-soft:#22305E;
  --owl:#B87A4B; --owl-dark:#8A5530; --belly:#F1D6A9; --eye:#FFFFFF; --pupil:#121933; --beak:#FFC43B;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.9rem} h2{font-size:1.45rem} h3{font-size:1.15rem}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,.card3d:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.tr{color:var(--muted);font-size:.86em}
.muted{color:var(--muted)}

/* Shell */
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:max(230px,14.5rem) minmax(0,1fr);gap:22px;align-items:start}
.side{position:sticky;top:12px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px 12px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:1.3rem;padding:4px 8px 12px;text-decoration:none}
.brand small{display:block;font-weight:500;font-size:.75rem;color:var(--muted);letter-spacing:.04em}
.brand .mini{width:48px;height:48px;object-fit:contain}
.side .brand{gap:6px;padding-left:2px;padding-right:2px}.brand>span{white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;text-decoration:none;font-weight:800;color:var(--muted)}
.nav a .i{font-size:1.3rem;width:28px;text-align:center}
.nav a:hover{background:var(--soft);color:var(--ink)}
.nav a.on{background:var(--soft);color:var(--ink);box-shadow:inset 4px 0 0 var(--accent)}
.nav .sm{display:none}
.side .me{margin-top:10px;border-top:2px dashed var(--line);padding-top:12px;display:flex;gap:10px;align-items:center}
.ava{width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:1.5rem;flex:none;border:2px solid var(--line)}
.main{min-width:0;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar .brand{display:none;padding:0;margin-right:auto}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.star{border-color:var(--sun)}
.pill .lbl{font-weight:600;color:var(--muted);font-size:.85em}
.bump{animation:bump .45s ease}
@keyframes bump{40%{transform:scale(1.18)}}

/* Ollie strip */
.ollie{display:flex;align-items:center;gap:14px}
.owl{width:88px;height:88px;flex:none;object-fit:contain}
.owl.hop{animation:hop .5s ease}
@keyframes hop{30%{transform:translateY(-10px) rotate(-4deg)}60%{transform:translateY(0) rotate(3deg)}}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 16px}
.bubble::before{content:"";position:absolute;left:-10px;top:26px;width:16px;height:16px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble .en{font-family:var(--display);font-weight:500;font-size:1.1rem}

/* Generic */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font-family:var(--display);font-weight:600;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.center{justify-content:center}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:600;font-size:1.05rem;padding:11px 20px;border-radius:16px;box-shadow:0 4px 0 var(--accent-2);transition:transform .1s;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-2)}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.small{font-size:.92rem;padding:7px 13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{font-weight:800;color:var(--accent-2);text-decoration:none}
.link:hover{text-decoration:underline}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:99px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--soft);border-radius:16px;padding:14px 16px}
.stat b{display:block;font-family:var(--display);font-weight:600;font-size:1.7rem;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-weight:600;font-size:.9rem}

/* Dashboard */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--line);stroke-width:12}
.ring .fill{fill:none;stroke:var(--sun);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;line-height:1.1}
.ring .lbl b{font-family:var(--display);font-size:1.6rem;display:block}
.continue{display:flex;gap:14px;align-items:center;background:var(--soft);border-radius:18px;padding:14px 16px;flex-wrap:wrap}
.continue .ic{font-size:2.2rem}
.continue .txt{flex:1;min-width:160px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:.85rem;color:var(--muted)}
.week i{width:34px;height:34px;border-radius:50%;background:var(--soft);border:2px solid var(--line);display:grid;place-items:center;font-style:normal}
.week .yes i{background:var(--sun);border-color:var(--sun)}
.week .now{color:var(--ink)}
.avas{display:flex;gap:8px;flex-wrap:wrap}
.avas button{width:52px;height:52px;border-radius:50%;font-size:1.7rem;background:var(--soft);border:3px solid transparent}
.avas button.on{border-color:var(--accent)}
.field{font-family:var(--body);font-size:1.1rem;padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%;max-width:340px}
.field:focus{border-color:var(--accent);outline:none}

/* Units */
.unit{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:20px;border:2px solid var(--line);background:var(--surface);text-decoration:none;min-width:0}
.unit:hover{border-color:var(--accent)}
.unit .top{display:flex;align-items:center;gap:12px}
.unit .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.7rem;background:var(--soft);flex:none}
.unit .nm{font-family:var(--display);font-weight:600;font-size:1.15rem}
.unit .no{font-family:var(--display);font-weight:600;font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.unit.locked{opacity:.55}
.unit.locked:hover{border-color:var(--line)}
.unit .meta{display:flex;justify-content:space-between;font-weight:700;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:99px;padding:3px 12px;font-weight:700;font-size:.9rem}
.chip.ok{background:var(--leaf-soft);color:var(--leaf)}
.lessons{display:flex;flex-direction:column;gap:10px}
.lesson{display:flex;align-items:center;gap:14px;padding:14px 16px;border:2px solid var(--line);border-radius:18px;flex-wrap:wrap}
.lesson .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;background:var(--soft);flex:none}
.lesson .txt{flex:1;min-width:150px}
.lesson .t{font-family:var(--display);font-weight:600;font-size:1.1rem}
.lesson.done{border-color:var(--leaf)}
.lesson.done .ic{background:var(--leaf-soft)}
.lesson.locked{opacity:.55}
.uhead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.uhead .ic{width:72px;height:72px;border-radius:22px;background:var(--soft);display:grid;place-items:center;font-size:2.4rem;flex:none}

/* Dictionary */
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:12px}
.word{border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.word .e{font-size:2.2rem;line-height:1}
.word .w{font-family:var(--display);font-weight:600;font-size:1.25rem}
.word .ipa{color:var(--accent-2);font-family:var(--display)}
.word .u{font-size:.78rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
select.field{max-width:240px}

/* Badges */
.badge{border:2px solid var(--line);border-radius:20px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;background:var(--surface)}
.badge .e{font-size:2.8rem;line-height:1}
.badge .n{font-family:var(--display);font-weight:600;font-size:1.1rem}
.badge.off .e{filter:grayscale(1);opacity:.35}
.badge.off .n{color:var(--muted)}
.badge.got{border-color:var(--sun)}

/* Lesson player */
.song{display:flex;flex-direction:column;gap:6px;background:var(--soft);border-radius:16px;padding:16px 18px}
.song p{font-family:var(--display);font-weight:500;font-size:1.15rem;padding:2px 8px;border-radius:10px;transition:background .2s}
.song p.on{background:var(--sun);color:#22304A}
.song b{color:var(--accent-2)}
.song p.on b{color:#22304A}
.cardwrap{display:flex;align-items:center;gap:10px;justify-content:center}
.card3d{perspective:900px;width:min(300px,100%);aspect-ratio:3/3.4;max-width:100%;cursor:pointer;border-radius:22px}
.card3d .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card3d.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;border:3px solid var(--ink);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--soft)}
.face .emo{font-size:5rem;line-height:1}
.face .word{font-family:var(--display);font-weight:700;font-size:2rem;letter-spacing:.05em;border:0;padding:0;background:none}
.face .ipa{font-family:var(--display);font-size:1.2rem;color:var(--accent-2)}
.face .ex{font-style:italic}
.face .hint{font-size:.8rem;color:var(--muted)}
.arrow{width:46px;height:46px;border-radius:50%;background:var(--soft);font-size:1.3rem;font-weight:800;flex:none}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.dots i.seen{background:var(--leaf)}
.progress{display:flex;gap:8px}
.progress span{flex:1;height:12px;border-radius:99px;background:var(--line)}
.progress span.done{background:var(--leaf)}
.progress span.now{background:var(--sun)}
.kind{font-family:var(--display);font-weight:600;font-size:1rem;display:inline-flex;gap:8px;align-items:center;background:var(--soft);padding:4px 14px;border-radius:99px;align-self:flex-start}
.q{font-family:var(--display);font-weight:600;font-size:1.45rem}
.songline{font-family:var(--display);font-size:1.3rem;background:var(--soft);padding:14px 16px;border-radius:14px}
.blank{display:inline-block;min-width:80px;border-bottom:3px dashed var(--accent);text-align:center;color:var(--accent-2)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
:is(.opt,.ans){background:var(--surface);border:3px solid var(--line);border-radius:18px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--display);font-weight:600;font-size:1.15rem;min-height:92px;justify-content:center;transition:transform .1s,border-color .15s}
:is(.opt,.ans):hover{border-color:var(--accent)}
:is(.opt,.ans) .emo{font-size:3rem;line-height:1}
:is(.opt,.ans) .sw{width:58px;height:58px;border-radius:50%;border:3px solid var(--ink)}
:is(.opt,.ans).right{border-color:var(--leaf);background:var(--leaf-soft)}
:is(.opt,.ans).wrong{border-color:var(--berry);background:var(--berry-soft);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bigemo{font-size:4.5rem;line-height:1;text-align:center}
.mask{font-family:var(--display);font-weight:700;font-size:1.6rem;letter-spacing:.2em;text-align:center}
.sentence{font-family:var(--display);font-size:1.35rem;text-align:center}
input.write{font-family:var(--display);font-size:1.5rem;padding:12px 16px;border-radius:14px;border:3px solid var(--line);background:var(--surface);color:var(--ink);width:100%;max-width:320px;text-align:center}
input.write:focus{border-color:var(--accent);outline:none}
.say{font-family:var(--display);font-weight:600;font-size:1.5rem;text-align:center;background:var(--soft);padding:18px;border-radius:16px}
.build{min-height:64px;border:3px dashed var(--line);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.build:empty::before{content:"Tap the words below ↓  Aşağıdaki kelimelere dokun";color:var(--muted)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{background:var(--surface);border:2px solid var(--ink);border-radius:12px;padding:8px 14px;font-family:var(--display);font-weight:600;font-size:1.15rem;box-shadow:0 3px 0 var(--line)}
.build .tile{background:var(--sun);color:#22304A;border-color:#22304A}
.fb{border-radius:16px;padding:14px 16px;font-weight:600}
.fb.good{background:var(--leaf-soft);border:2px solid var(--leaf)}
.fb.try{background:var(--berry-soft);border:2px solid var(--berry)}
.fb .en{font-family:var(--display);font-size:1.15rem}
.ans:disabled{cursor:default}
.story{display:flex;flex-direction:column;gap:4px;background:var(--soft);border-radius:16px;padding:14px 12px}
.story .line{display:block;width:100%;text-align:left;font-family:var(--display);font-weight:500;font-size:1.2rem;line-height:1.45;padding:4px 8px;border-radius:10px;background:none;border:0;color:inherit;cursor:pointer}
.story .line:hover{background:var(--surface)}
.story .line.on{background:var(--sun);color:#22304A}
.story .line .tr{display:block;font-family:var(--body);font-size:.95rem;font-weight:400}
.story .line.on .tr{color:#22304A}
.rq{padding-top:12px;border-top:2px dashed var(--line)}
.rq:first-of-type{border-top:0;padding-top:0}
.heard .hw{padding:0 4px;border-radius:8px}
.heard .hw.ok{color:var(--leaf);background:var(--leaf-soft)}
.heard .hw.no{color:var(--berry);background:var(--berry-soft);text-decoration:underline wavy}
.hidden-text{font-style:italic;color:var(--muted)}

/* Overlay, toast, confetti */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 72%,transparent);display:grid;place-items:center;z-index:40;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border:3px solid var(--sun);border-radius:28px;padding:28px 24px;max-width:440px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;animation:pop .4s ease}
.modal h2{font-size:2.1rem;color:var(--accent-2)}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:16px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}
.confetti{position:fixed;top:-40px;font-size:1.6rem;pointer-events:none;z-index:45;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
textarea.essay{width:100%;min-height:210px;font-family:var(--body);font-size:1.12rem;line-height:1.65;padding:14px 16px;border-radius:16px;border:3px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
textarea.essay:focus{border-color:var(--accent);outline:none}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:12px;background:var(--soft);font-weight:600}
.checks li.ok{background:var(--leaf-soft)}
.checks li .m{flex:none;width:22px;text-align:center}
.bonus{background:var(--sky-soft);border:2px solid var(--sky);border-radius:16px;padding:12px 16px;font-weight:600}
.model{background:var(--soft);border-radius:16px;padding:14px 16px;font-style:italic}
.wc{font-weight:800;font-variant-numeric:tabular-nums}
.auth{max-width:580px;width:100%;margin:0 auto}
.tabs{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:14px;align-self:flex-start}
.tabs a{padding:8px 16px;border-radius:10px;text-decoration:none;font-weight:800;color:var(--muted)}
.tabs a.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.stack{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.stack label{font-weight:800;margin-top:4px}
.stack .field{max-width:none}
button.chip{cursor:pointer;border:2px solid transparent}
button.chip:hover{border-color:var(--accent)}
.side .me .link{font-size:.85rem}
body.out .side,body.out .pills{display:none}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.kid{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px;background:var(--soft);border:2px solid transparent;border-radius:18px;cursor:pointer;font:inherit;color:inherit}
.kid:hover,.kid:focus-visible{border-color:var(--accent)}
.kid .ava{width:64px;height:64px;font-size:2.2rem}
.kid b{font-size:1.1rem}
.kidrow{background:var(--soft);border-radius:16px;padding:10px 14px;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none}
body.out .shell{grid-template-columns:minmax(0,1fr);max-width:720px}

/* Phone: sidebar becomes a bottom tab bar */
@media (max-width:860px){
  body{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:30;border-radius:20px 20px 0 0;border-width:2px 0 0;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .side .brand,.side .me{display:none}
  .nav{flex-direction:row;justify-content:space-around;gap:2px;overflow-x:auto;scrollbar-width:none}
  .nav a{flex-direction:column;gap:2px;padding:6px 2px;font-size:.7rem;flex:1 1 0;min-width:44px;text-align:center;white-space:nowrap;letter-spacing:-.01em}
  .nav a .i{font-size:1.2rem;width:auto}
  .nav a.on{box-shadow:inset 0 -3px 0 var(--accent)}
  .topbar .brand{display:flex}
  body.out{padding-bottom:40px}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .hero{grid-template-columns:minmax(0,1fr)}
  .ring{justify-self:center}
}
@media (max-width:440px){.nav a{font-size:.66rem;min-width:0}.nav{gap:0}.nav .lg{display:none}.nav .sm{display:inline}.q{font-size:1.25rem}.face .emo{font-size:4rem}.owl{width:70px;height:70px}h1{font-size:1.6rem}.pills .pill .lbl{display:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

function evalWriting(i, text){
  const W = WRITE[i], L = LEVELS[i];
  const words = text.match(/[A-Za-z][A-Za-z'’]*/g) || [];
  const low = " " + text.toLowerCase().replace(/’/g,"'").replace(/\s+/g," ") + " ";
  const used = L.cards.filter(c=>new RegExp(`\\b${c.w}(s|es)?\\b`).test(low)).map(c=>c.w);
  const sents = text.split(/[.!?]+/).map(x=>x.trim()).filter(Boolean);
  const tidy = sents.length > 0 && sents.every(x=>/^[A-Z"“]/.test(x)) && /[.!?]["”]?\s*$/.test(text.trim());
  const pat = W.checks.map(c=>c.re.test(low));
  const n = words.length;
  const checks = [
    {ok:n>=WMIN, t:`En az ${WMIN} kelime yaz (${n}/${WMIN})`, p:"+20"},
    {ok:used.length>=3, t:`Bu ünitenin kelimelerinden en az 3 tane kullan (${used.length}/3)`, p:"kelime başı +2"},
    ...W.checks.map((c,k)=>({ok:pat[k], t:c.t, p:"+5"})),
    {ok:tidy, t:"Cümleler büyük harfle başlasın, nokta ile bitsin", p:"+5"},
    {ok:n>=WLONG, t:`Süper yazar: ${WLONG}+ kelime`, p:"+5"}
  ];
  const pts = n < WMIN ? 0 : 20 + Math.min(used.length*2, 10) + pat.filter(Boolean).length*5 + (tidy?5:0) + (n>=WLONG?5:0);
  return {n, used, checks, pts};
}

function normalize(s){
  s = s || {};
  if(!(s.p && s.p.easy && s.p.hard)){
    s = Array.isArray(s.done) ? {score:s.score||0, p:{easy:{unlocked:s.unlocked||0, done:s.done, finished:!!s.finished}, hard:fresh()}} : blankData();
  }
  for(const m of ["easy","hard"]){ const p = s.p[m]; while(p.done.length < LEVELS.length) p.done.push([]); }
  s.score = s.score||0; s.lessons = s.lessons||{}; s.days = s.days||[]; s.today = s.today||{d:"",pts:0};
  s.name = s.name||""; s.avatar = s.avatar||"🦊"; s.writings = s.writings||{}; s.sung = s.sung||{};
  s.skills = s.skills||{}; for(const k of ["r","l","s"]) s.skills[k] = s.skills[k]||{};
  if(!s.badges){ s.badges = []; s.needBadgeInit = true; }
  return s;
}

async function api(path, opt={}){
  const headers = {"Content-Type":"application/json"};
  if(auth && auth.token) headers.Authorization = "Bearer " + auth.token;
  let res;
  try{ res = await fetch(API + path, {method: opt.method || (opt.body ? "POST" : "GET"), headers, body: opt.body ? JSON.stringify(opt.body) : undefined, keepalive: !!opt.keepalive}); }
  catch(e){ const err = new Error("İnternet bağlantısı yok gibi görünüyor. Bağlantını kontrol edip tekrar dene."); err.offline = true; throw err; }
  let data = {}; try{ data = await res.json(); }catch(e){}
  if((res.status === 401 || res.status === 403) && auth && path !== "/me/password" && path !== "/me/delete"){
    auth = null; saveAuth(); S = null; childId = null; play = null; go("login");
    setTimeout(()=>authMsg(esc(data.error || "Yeniden giriş yap.")), 50);
  }
  if(!res.ok){ const err = new Error(data.error || "Bir sorun oldu, tekrar dene."); err.status = res.status; throw err; }
  return data;
}

async function sync(keepalive){
  clearTimeout(syncTimer);
  if(!childId || !auth) return;
  const id = childId, c = readCache(id);
  if(!c || !c.dirty) return;
  if(syncing && !keepalive){ syncTimer = setTimeout(sync, 1500); return; }
  syncing = true;
  try{
    await api("/children/" + id, {method:"PUT", body:{data:c.data, name:c.data.name || undefined, avatar:c.data.avatar}, keepalive});
    const cur = readCache(id); if(cur && JSON.stringify(cur.data) === JSON.stringify(c.data)) writeCache(id, c.data, false);
    const k = auth && auth.children.find(x=>x.id === id);
    if(k){ k.name = c.data.name || k.name; k.avatar = c.data.avatar; k.score = c.data.score; k.updated_at = Date.now(); saveAuth(); }
  }catch(e){ if(e.offline || e.status >= 500) syncTimer = setTimeout(sync, 15000); }
  finally{ syncing = false; }
}

let voice = null;
function pickVoice(){ try{ const v = speechSynthesis.getVoices(); voice = v.find(x=>/en[-_]US/i.test(x.lang)) || v.find(x=>/^en/i.test(x.lang)) || null; }catch(e){} }
try{ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }catch(e){}
function speak(text, onend, rate){
  try{
    if(!("speechSynthesis" in window)) throw 0;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = rate || .82; u.pitch = 1.1; if(voice) u.voice = voice;
    if(onend){ u.onend = onend; u.onerror = onend; }
    speechSynthesis.speak(u);
  }catch(e){ say("Oops, no sound here.", "Bu cihazda ses çıkmıyor. Metni okuyabilirsin!"); onend && onend(); }
}

let page = "home", unitArg = 0, play = null;
function route(){
  stopSpeech(); stopRec(); play = null; sk = null;
  const h = location.hash.slice(1) || "home";
  if(!S){
    if(auth){ page = ["profiles","parent"].includes(h) ? h : "profiles"; if(page !== h) history.replaceState(null, "", "#"+page); }
    else page = ["register","forgot"].includes(h) ? h : "login";
    render(true); return;
  }
  if(["login","register","forgot","profiles","parent"].includes(h)){ history.replaceState(null, "", "#home"); }
  const m = h.match(/^unit-(\d+)$/);
  const sm = h.match(/^(reading|listening|speaking)(?:-(\d+))?$/);
  if(m && +m[1]>=1 && +m[1]<=LEVELS.length){ page = "unit"; unitArg = +m[1]-1; }
  else if(sm){ page = sm[1]; if(sm[2] && +sm[2]>=1 && +sm[2]<=LEVELS.length) startSkill(sm[1], +sm[2]-1); }
  else page = ["home","units","words","badges","profile"].includes(h) ? h : "home";
  render(true);
}

      <div class="sentence hidden-text" id="txt" hidden>“${esc(t.say)}”</div>`;
    body = audio + `<div class="q">${esc(t.q)} <span class="tr">${esc(t.tr)}</span></div>
      <div class="opts">${t.options.map(o=> typeof o==="string"

        : `<button class="opt" data-v="${o.v}" aria-label="${o.v}">${o.c?`<span class="sw" style="background:${o.c}"></span>`:`<span class="emo">${o.e}</span>`}</button>`).join("")}</div>`;
  } else if(t.type==="dictation"){

      <div class="row center"><button class="btn" data-act="play">🔊 Listen</button><button class="btn ghost" data-act="slow">🐢 Slow</button></div>
      <div class="bigemo" id="dictEmo">❓</div>${formHTML()}`;
  } else if(t.type==="write"){
    body = `<div class="q">Write the missing word! <span class="tr">Eksik kelimeyi yaz!</span></div>
      <div class="bigemo">${t.e}</div><div class="mask">${t.mask}</div>
      <div class="sentence">${esc(t.sentence).replace("___",'<span class="blank">?</span>')} <span class="tr">(${esc(t.tr)})</span></div>${formHTML()}`;

      <div class="build" id="build" aria-label="Senin cümlen"></div><div class="bank" id="bank"></div>
      <div class="row center"><button class="btn ghost small" data-act="clearOrder">↺ Clear</button><button class="btn" data-act="checkOrder">Check ✓</button></div>
      <div class="tr" style="text-align:center">Dikkat: kelimelerden biri fazla! 🕵️</div>`;
  } else if(t.type==="speakTr"){
    body = `<div class="q">Say it in English! <span class="tr">Bunu İngilizce söyle!</span></div>
      <div class="say">🇹🇷 “${esc(t.tr)}”</div>
      <div class="tr" style="text-align:center">1) Önce kendin yüksek sesle İngilizce söyle · 2) "Show answer" ile kontrol et</div>
      <div class="row center" id="reveal">${revealHTML(false,t)}</div>`;
  } else {
    body = `<div class="q">Say it out loud! <span class="tr">Yüksek sesle söyle!</span></div>
      <div class="say">“${esc(t.sentence)}”<div class="tr" style="font-family:var(--body);font-weight:400">${esc(t.tr)}</div></div>
      <div class="row center"><button class="btn ghost" data-act="play">🔊 Listen first</button><button class="btn" data-act="said">🎙️ I said it!</button></div>

  }

    <div class="eyebrow">Ünite ${play.unit+1} · ${L.theme} · Görev ${play.task+1}/5${play.replay?" · Tekrar (⭐+2)":""}</div>
    <div class="progress">${prog}</div>

  </section>`;
}
function startOrder(t){
  const words = t.answer.split(" ").concat(t.extra);
  let tiles; do{ tiles = words.slice().sort(()=>Math.random()-.5); }while(tiles.slice(0,words.length-1).join(" ")===t.answer);
  play.order = {tiles, picked:[]};
}
function renderOrder(){
  const b=$("#build"), k=$("#bank"); if(!b||!k) return; const o = play.order;
  b.innerHTML = o.picked.map(i=>`<button class="tile" data-i="${i}">${esc(o.tiles[i])}</button>`).join("");
  k.innerHTML = o.tiles.map((w,i)=> o.picked.includes(i) ? "" : `<button class="tile" data-i="${i}">${esc(w)}</button>`).join("");
}

function startStep(i, kind){
  stopSpeech();
  if(location.hash !== `#unit-${i+1}`){ history.replaceState(null, "", `#unit-${i+1}`); }
  page = "unit"; unitArg = i;
  if(kind==="song"){ const sg = S.sung[i]||[]; play = {kind, unit:i, songIdx: Math.max(0,[0,1,2,3,4].findIndex(n=>!sg.includes(n)))}; render(); say("Let's sing! 🎤", "Önce 🔊 Sing along düğmesine bas, sonra sen de söyle."); return; }
  if(kind==="write"){ play = {kind, unit:i}; render(); liveWrite(); say("Writing time! ✍️", "Küçük bir metin yaz, ek yıldız kazan! Yazarken kontrol listesindeki kutular dolacak."); return; }
  if(kind==="cards"){ play = {kind, unit:i, cardIdx:0, seen:new Set([0])}; render(); say("New words! 🃏", "Karta dokun ve çevir. Kelimeyi dinle, sonra sen de söyle."); return; }
  const done = S.p[kind].done[i], replay = done.length >= 5;
  play = {kind:"quiz", mode:kind, unit:i, replay, local:new Set(replay ? [] : done), task:0};
  play.task = [0,1,2,3,4].find(n=>!play.local.has(n));
  startTask();
}
function startTask(){
  play.tries = 0; play.solved = false; play.order = null;
  const t = tasksOf()[play.task];
  if(t.type==="order") startOrder(t);
  render();
  const m = INTRO[t.type]; say(m[0], m[1]);
  const inp = document.querySelector("input.write"); if(inp) setTimeout(()=>inp.focus(), 50);
}
function correct(note){
  if(play.solved) return; play.solved = true;
  const hard = play.mode==="hard", fresh = !S.p[play.mode].done[play.unit].includes(play.task);
  const pts = !fresh ? 2 : hard ? (play.tries===0 ? 20 : 10) : (play.tries===0 ? 10 : 5);
  if(fresh) S.p[play.mode].done[play.unit].push(play.task);
  play.local.add(play.task);
  addPts(pts);
  const p = PRAISE[Math.floor(Math.random()*PRAISE.length)];
  say(`${p[0]} ⭐ +${pts}!`, `${p[1]} ${pts} yıldız kazandın!`);
  const last = play.local.size >= 5;
  $("#fb").innerHTML = `<div class="fb good"><div class="en">${p[0]} ⭐ +${pts}</div>${note?`<div>${note}</div>`:""}</div>
    <div class="row center" style="margin-top:12px"><button class="btn" data-act="nextTask">${last?"🏆 Testi bitir":"Next task ▶"}</button></div>`;
  $('[data-act="nextTask"]').focus();
}
function wrong(t){
  play.tries++;
  if(play.mode==="hard" && play.tries===1){
    say("Almost! Try once more.", "Neredeyse! Bir kez daha dene.");
    $("#fb").innerHTML = `<div class="fb try"><div class="en">Almost! Think again. 🤔</div><div class="tr">Bir daha dene. Bir kez daha yanılırsan Ollie ipucu verecek.</div></div>`;
    return;
  }
  say("Great try! But remember…", "Güzel deneme! Ama hatırla…");
  $("#fb").innerHTML = `<div class="fb try"><div class="en">Great try! But remember… ${esc(t.hint[0])}</div><div class="tr">${esc(t.hint[1])}</div></div>`;
}
function nextTask(){
  if(play.local.size >= 5) return finishQuiz();
  let n = play.task; do{ n = (n+1)%5; } while(play.local.has(n));
  play.task = n; startTask();
}
function finishQuiz(){
  const i = play.unit, mode = play.mode, nx = LEVELS[i+1];
  confetti(); speak(mode==="hard" ? "Amazing! You are a brave eagle!" : "Unit complete! Great job!");
  say("Test complete! 🎉", "Testi bitirdin, süpersin!");
  const btns = [];
  if(mode==="easy") btns.push(`<button class="btn" data-act="startStep" data-arg="${i}:write">✍️ Yaz, ek puan kazan!</button>`, `<button class="btn ghost" data-act="startStep" data-arg="${i}:hard">🦅 Zor teste geç</button>`);
  if(nx) btns.push(`<a class="btn ${mode==="easy"?"ghost":""}" href="#unit-${i+2}" data-act="close">Ünite ${i+2}: ${nx.theme} ▶</a>`);
  btns.push(`<a class="btn ghost" href="#unit-${i+1}" data-act="close">Ünite sayfası</a>`);
  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<div class="modal" role="dialog" aria-label="Test tamamlandı">
    <div style="font-size:3.5rem">${mode==="hard"?"🦅":"🏆"}</div>
    <h2>${mode==="hard"?"Brave Eagle!":"Unit Complete!"}</h2>
    <div>Ünite ${i+1}: <b>${LEVELS[i].theme}</b> · ${LESSON[mode].n} tamam!</div>
    ${mode==="easy" && nx && !play.replay ? `<div class="chip ok">🔓 Ünite ${i+2}: ${nx.theme} açıldı!</div>` : ""}
    ${mode==="easy" && !nx ? `<div class="chip ok">👑 Bütün üniteleri bitirdin!</div>` : ""}
    ${mode==="easy" ? `<div class="bonus">✍️ Şimdi “${WRITE[i].title}” hakkında kısa bir metin yaz, <b>50 ⭐'a kadar ek puan</b> kazan!</div>` : ""}
    <div class="pill star">⭐ ${S.score} yıldız</div>
    <div class="row center">${btns.join("")}</div></div>`;
  document.body.appendChild(ov);
  play = null;
  ov.querySelector(".btn").focus();
}


/* ---------- Reading · Listening · Speaking bölümleri ---------- */
const SKILL = {
  reading:{e:"📕", n:"Reading", tr:"Okuma", key:"r", unitName:"hikâye", total:i=>READING[i].qs.length},
  listening:{e:"🎧", n:"Listening", tr:"Dinleme", key:"l", unitName:"dinleme", total:i=>LISTENING[i].length},
  speaking:{e:"🗣️", n:"Speaking", tr:"Konuşma", key:"s", unitName:"cümle", total:i=>SPEAKING[i].length}
};
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const skDone = (type,i) => S.skills[SKILL[type].key][i] || [];
const skComplete = (type,i) => skDone(type,i).length >= SKILL[type].total(i);
const skCount = type => LEVELS.filter((_,i)=>skComplete(type,i)).length;
let sk = null, rec = null;
function stopRec(){ if(rec){ const r = rec; rec = null; try{ r.abort(); }catch(e){} } }
function startSkill(type, i){
  const done = skDone(type, i), full = skComplete(type, i);
  sk = {type, unit:i, local:new Set(full ? [] : done), tries:{}, answered:{}, solved:false, showTr:false, idx:0};
  if(type !== "reading") sk.idx = Math.max(0, [...Array(SKILL[type].total(i)).keys()].find(n=>!sk.local.has(n)) ?? 0);
}
function skAward(type, i, n, pts){
  const k = SKILL[type].key, d = S.skills[k][i] = S.skills[k][i] || [];
  const was = skComplete(type, i);
  if(d.includes(n)) pts = 1; else d.push(n);
  addPts(pts);
  let bonus = 0;
  if(!was && skComplete(type, i)){ bonus = 5; addPts(5); confetti(); toast(`${SKILL[type].e} ${SKILL[type].n} · Ünite ${i+1} tamam! +5 ⭐`); }
  return {pts, bonus};
}
function skBack(){ const K = SKILL[sk.type]; return `<div class="row between"><a class="link" href="#${sk.type}">← ${K.n} · ${K.tr}</a><span class="chip">${K.e} Ünite ${sk.unit+1}: ${LEVELS[sk.unit].theme}</span></div>`; }
function skLocked(){ const i = sk.unit;
  return `${skBack()}<section class="panel"><div class="uhead"><span class="ic">🔒</span><div><div class="eyebrow">Ünite ${i+1}</div><h1>${LEVELS[i].theme}</h1></div></div>
    <p>Bu bölüm henüz kilitli. Önce <a class="link" href="#unit-${i}">Ünite ${i}: ${LEVELS[i-1].theme}</a> kolay testini bitir.</p></section>`; }
function skProg(total){ return `<div class="progress">${[...Array(total).keys()].map(n=>`<span class="${sk.local.has(n)?"done":n===sk.idx?"now":""}"></span>`).join("")}</div>`; }

function skillListHTML(type){
  const K = SKILL[type];
  const desc = {
    reading:"Kısa hikâyeleri oku, istersen Ollie'ye okut, sonra soruları cevapla. İlk denemede doğru cevap ⭐+5.",
    listening:"Ollie'yi dikkatle dinle ve doğru resmi seç. Önce metne bakmadan dene! İlk denemede doğru cevap ⭐+5.",
    speaking:"Cümleyi dinle, sonra 🎤 düğmesine basıp sen söyle. Ollie seni dinler ve hangi kelimeleri doğru söylediğini gösterir. Her cümle ⭐+5."
  }[type];
  const note = type==="speaking" && !SR ? `<div class="fb try">Bu tarayıcı konuşmayı dinleyemiyor. Chrome, Edge ya da Safari'de Ollie sesini kontrol eder. Burada da çalışabilirsin: cümleyi yüksek sesle söyleyip "I said it!" düğmesine bas.</div>` : "";
  return `<section class="panel"><div class="eyebrow">${K.n} · ${K.tr}</div><h1>${K.e} ${K.n}</h1><p class="muted">${desc}</p>${note}
    <div class="row"><span class="chip ok">✓ ${skCount(type)}/10 ünite tamam</span></div></section>
  <div class="grid g3">${LEVELS.map((L,i)=>{ const open = unitOpen(i), n = skDone(type,i).length, tot = K.total(i), done = n >= tot;
    const nm = type==="reading" ? READING[i].title : L.theme;
    const st = !open ? `<span class="chip">🔒 Kilitli</span>` : done ? `<span class="chip ok">✓ Tamam</span>` : n ? `<span class="chip">Devam ediyor</span>` : `<span class="chip">Yeni</span>`;
    return `<a class="unit ${open?"":"locked"}" href="#${type}-${i+1}" ${open?"":'aria-disabled="true"'}>
      <div class="top"><span class="ic">${type==="reading"?READING[i].e:L.icon}</span><div style="min-width:0"><div class="no">Ünite ${i+1}${type==="reading"?" · "+L.theme:""}</div><div class="nm">${esc(nm)}</div><div class="tr">${tot} ${K.unitName==="hikâye"?"soru":K.unitName}</div></div></div>
      <div class="bar"><i style="width:${Math.round(n/tot*100)}%"></i></div>
      <div class="meta"><span>${st}</span><span>${n}/${tot}</span></div></a>`; }).join("")}</div>`;
}

function readingHTML(){
  if(!unitOpen(sk.unit)) return skLocked();
  const i = sk.unit, R = READING[i], d = skDone("reading", i);
  return `${skBack()}<section class="panel">
    <div class="eyebrow">Ünite ${i+1} · ${LEVELS[i].theme} · Reading</div>
    <h1>${R.e} ${esc(R.title)}</h1>
    <div class="row"><button class="btn" data-act="readAll">🔊 Read to me</button><button class="btn ghost small" data-act="readSlow">🐢 Slow</button><button class="btn ghost small" data-act="toggleTr">🇹🇷 ${sk.showTr?"Türkçeyi gizle":"Türkçesini göster"}</button></div>
    <div class="story" id="story">${R.lines.map((l,n)=>`<button type="button" class="line" data-act="readLine" data-arg="${n}">${esc(l[0])}${sk.showTr?`<span class="tr">${esc(l[1])}</span>`:""}</button>`).join("")}</div>
    <p class="tr">Bir cümleye dokun, Ollie sana okusun. Bilmediğin kelimeler için Türkçesine bakabilirsin.</p>
  </section>
  <section class="panel"><h2>Questions <span class="tr">· Sorular · <span id="rcount">${d.length}</span>/${R.qs.length} doğru</span></h2>
    ${R.qs.map((q,n)=>{ const ok = sk.answered[n];
      return `<div class="stack rq"><div class="q" style="font-size:1.2rem">${n+1}. ${esc(q.q)} <span class="tr">${esc(q.tr)}</span></div>
        <div class="opts">${q.options.map(o=>`<button class="ans ${ok && o===q.answer?"right":""}" data-act="skAns" data-arg="${n}" data-v="${esc(o)}" ${ok?"disabled":""}>${esc(o)}</button>`).join("")}</div>
        <div id="rfb-${n}"></div></div>`; }).join("")}
    <div id="rdone"></div>
  </section>`;
}
function readStory(rate){
  if(singing){ stopSpeech(); document.querySelectorAll("#story .line").forEach(p=>p.classList.remove("on")); return; }
  const ls = [...document.querySelectorAll("#story .line")], lines = READING[sk.unit].lines;
  singing = true; let n = 0;
  const step = () => {
    ls.forEach(p=>p.classList.remove("on"));
    if(!singing || n>=lines.length || !document.body.contains(ls[0])){ singing = false; return; }
    ls[n].classList.add("on"); speak(lines[n][0], ()=>{ n++; setTimeout(step, 300); }, rate);
  };
  step();
}
function readAnswer(b, n){
  const i = sk.unit, R = READING[i], q = R.qs[n];
  if(sk.answered[n]) return;
  if(b.dataset.v === q.answer){
    sk.answered[n] = true;
    const r = skAward("reading", i, n, sk.tries[n] ? 2 : 5);
    b.classList.add("right"); b.parentNode.querySelectorAll("button").forEach(x=>x.disabled = true);
    const rc = $("#rcount"); if(rc) rc.textContent = skDone("reading", i).length;
    const p = PRAISE[Math.floor(Math.random()*PRAISE.length)];
    $("#rfb-"+n).innerHTML = `<div class="fb good">${p[0]} ⭐ +${r.pts}</div>`;
    say(`${p[0]} ⭐ +${r.pts}`, `${p[1]} ${r.pts} yıldız kazandın!`);
    if(Object.keys(sk.answered).length === R.qs.length){
      $("#rdone").innerHTML = `<div class="fb good"><div class="en">🏆 Story complete!${r.bonus?" ⭐ +5 bonus":""}</div><div class="tr">Hikâyeyi bitirdin, bütün soruları doğru cevapladın!</div></div>
        <div class="row center" style="margin-top:12px"><a class="btn ghost" href="#reading">📕 Hikâyeler</a>${i<LEVELS.length-1 && unitOpen(i+1)?`<a class="btn" href="#reading-${i+2}">Sonraki hikâye ▶</a>`:""}</div>`;
      speak("Great reading! You finished the story!");
    }
  } else {
    sk.tries[n] = (sk.tries[n]||0) + 1;
    b.classList.add("wrong"); setTimeout(()=>b.classList.remove("wrong"), 600);
    $("#rfb-"+n).innerHTML = `<div class="fb try">Not quite! Read the story again. 🔍 <span class="tr">Cevap hikâyenin içinde, bir daha oku!</span></div>`;
    say("Good try! Look at the story again.", "Güzel deneme! Hikâyeye bir daha bak.");
  }
}

function listeningHTML(){
  if(!unitOpen(sk.unit)) return skLocked();
  const i = sk.unit, items = LISTENING[i], t = items[sk.idx];
  return `${skBack()}<section class="panel">
    <div class="eyebrow">Ünite ${i+1} · ${LEVELS[i].theme} · Listening ${sk.idx+1}/${items.length}</div>
    ${skProg(items.length)}
    <span class="kind">🎧 Listen & Pick</span>

    <div class="sentence hidden-text" id="txt" hidden>“${esc(t.say)}”</div>
    <div class="q">${esc(t.q)} <span class="tr">${esc(t.tr)}</span></div>

      ? `<button class="ans" data-act="skAns" data-v="${esc(o)}">${esc(o)}</button>`

    <div id="fb"></div>
  </section>`;
}
function listenAnswer(b){
  if(sk.solved) return;
  const i = sk.unit, t = LISTENING[i][sk.idx];
  if(b.dataset.v === t.answer){
    b.classList.add("right");
    skCorrect(sk.tries[sk.idx] ? 2 : 5, `“${esc(t.say)}”`);
    speak(t.say);
  } else {
    sk.tries[sk.idx] = (sk.tries[sk.idx]||0) + 1;
    b.classList.add("wrong"); setTimeout(()=>b.classList.remove("wrong"), 600);
    say("Listen again!", "Bir daha dinle! 🔊 düğmesine bas.");
    $("#fb").innerHTML = `<div class="fb try">Listen again! 👂 <span class="tr">Bir daha dinle. Zorlanırsan 🐢 Slow ile yavaş dinleyebilirsin.</span></div>`;
  }
}
function skCorrect(pts, note){
  sk.solved = true;
  const total = SKILL[sk.type].total(sk.unit);
  const r = skAward(sk.type, sk.unit, sk.idx, pts);
  sk.local.add(sk.idx);
  const p = PRAISE[Math.floor(Math.random()*PRAISE.length)];
  say(`${p[0]} ⭐ +${r.pts}!`, `${p[1]} ${r.pts} yıldız kazandın!`);
  const last = sk.local.size >= total;
  $("#fb").innerHTML = `<div class="fb good"><div class="en">${p[0]} ⭐ +${r.pts}${r.bonus?" · 🏆 +5 bonus":""}</div>${note?`<div>${note}</div>`:""}</div>
    <div class="row center" style="margin-top:12px">${last
      ? `<a class="btn ghost" href="#${sk.type}">${SKILL[sk.type].e} Bütün üniteler</a>${sk.unit<LEVELS.length-1 && unitOpen(sk.unit+1)?`<a class="btn" href="#${sk.type}-${sk.unit+2}">Sonraki ünite ▶</a>`:""}`
      : `<button class="btn" data-act="skNext">Next ▶</button>`}</div>`;
  const nb = $("#fb .btn:last-child"); if(nb) nb.focus();
}
function skNext(){
  const total = SKILL[sk.type].total(sk.unit);
  let n = sk.idx; do{ n = (n+1) % total; } while(sk.local.has(n) && sk.local.size < total);
  sk.idx = n; sk.solved = false; stopRec(); render();
  if(sk.type==="listening"){ say("Listen carefully!", "Dikkatle dinle!"); setTimeout(()=>speak(LISTENING[sk.unit][sk.idx].say), 300); }
  else say("Your turn to talk!", "Önce dinle, sonra sen söyle!");
}

function speakingHTML(){
  if(!unitOpen(sk.unit)) return skLocked();
  const i = sk.unit, items = SPEAKING[i], t = items[sk.idx], tries = sk.tries[sk.idx] || 0, mic = SR && !sk.noMic;
  return `${skBack()}<section class="panel">
    <div class="eyebrow">Ünite ${i+1} · ${LEVELS[i].theme} · Speaking ${sk.idx+1}/${items.length}</div>
    ${skProg(items.length)}
    <span class="kind">🗣️ Say it!</span>
    <div class="bigemo">${t.e}</div>
    <div class="say">“${esc(t.en)}”<div class="tr" style="font-family:var(--body);font-weight:400">${esc(t.tr)}</div></div>
    <div class="row center"><button class="btn ghost" data-act="skPlay">🔊 Listen</button><button class="btn ghost small" data-act="skSlow">🐢 Slow</button>
      ${mic ? `<button class="btn" data-act="mic" id="micBtn">🎤 Speak</button>` : `<button class="btn" data-act="skSaid">🎙️ I said it!</button>`}</div>
    <div class="tr" style="text-align:center">${mic ? "1) Önce Ollie'yi dinle · 2) 🎤 Speak'e bas · 3) Cümleyi yüksek sesle söyle" : "1) Ollie'yi dinle · 2) Sen yüksek sesle söyle · 3) \"I said it!\" düğmesine bas"}</div>
    <div id="heard"></div>
    <div id="fb">${mic && tries >= 2 ? skipHTML() : ""}</div>
  </section>`;
}
const skipHTML = () => `<div class="row center"><span class="tr">Ollie seni anlamakta zorlanıyor olabilir.</span><button class="btn ghost small" data-act="skSaid">Doğru söyledim, geç ▶</button></div>`;
const NUMW = {"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","11":"eleven","12":"twelve"};
const toks = s => norm(s.replace(/-/g," ")).split(" ").filter(Boolean).map(w => w==="cannot" ? "can't" : NUMW[w] || w);
function matchWords(target, heard){
  const pool = {}; toks(heard).forEach(w=>pool[w] = (pool[w]||0) + 1);
  const words = target.split(/\s+/).map(w=>{ const k = toks(w)[0]; const ok = !!(k && pool[k] > 0); if(ok) pool[k]--; return {w, ok}; });
  return {words, score: words.filter(x=>x.ok).length / words.length};
}
function startMic(){
  if(sk.solved || rec) return;
  stopSpeech();
  const t = SPEAKING[sk.unit][sk.idx], btn = $("#micBtn");
  let r;
  try{ r = new SR(); }catch(e){ sk.noMic = true; render(); return; }
  rec = r; r.lang = "en-US"; r.interimResults = false; r.maxAlternatives = 5;
  let handled = false;
  btn.textContent = "👂 Listening…"; btn.disabled = true;
  say("I'm listening… 👂", "Dinliyorum, şimdi cümleyi söyle!");
  r.onresult = e => {
    handled = true;
    const alts = [...e.results[0]].map(a=>a.transcript);
    const best = alts.map(a=>Object.assign({a}, matchWords(t.en, a))).sort((x,y)=>y.score-x.score)[0];
    $("#heard").innerHTML = `<div class="say heard">${best.words.map(w=>`<span class="hw ${w.ok?"ok":"no"}">${esc(w.w)}</span>`).join(" ")}</div>
      <div class="tr" style="text-align:center">Ollie şunu duydu: “${esc(best.a)}”</div>`;
    if(best.score >= .8) skCorrect(sk.tries[sk.idx] ? 3 : 5, `“${esc(t.en)}” <span class="tr">Telaffuzun çok güzel!</span>`);
    else {
      sk.tries[sk.idx] = (sk.tries[sk.idx]||0) + 1;
      const almost = best.score >= .5;
      say(almost ? "Almost! Try again." : "Let's try again!", almost ? "Neredeyse! Kırmızı kelimelere dikkat edip tekrar söyle." : "Önce Ollie'yi dinle, sonra yavaşça tekrar söyle.");
      $("#fb").innerHTML = `<div class="fb try">${almost ? "Almost! 💪" : "Try again! 🙂"} <span class="tr">Yeşil kelimeleri doğru söyledin. Kırmızı olanları dinleyip tekrar dene.</span></div>${sk.tries[sk.idx] >= 2 ? skipHTML() : ""}`;
    }
  };
  r.onerror = e => {
    handled = true;
    if(e.error === "not-allowed" || e.error === "service-not-allowed"){
      sk.noMic = true; render();
      $("#fb").innerHTML = `<div class="fb try">Mikrofon izni verilmedi. Tarayıcının adres çubuğundan mikrofona izin verebilirsin. Şimdilik cümleyi yüksek sesle söyleyip "I said it!" düğmesine bas.</div>`;
    } else if(e.error !== "aborted"){
      say("I can't hear you!", "Seni duyamadım. Mikrofona yakın konuş ve tekrar dene.");
      $("#fb").innerHTML = `<div class="fb try">Seni duyamadım. 🎤 düğmesine bastıktan sonra hemen konuş.</div>`;
    }
  };
  r.onend = () => {
    if(rec === r) rec = null;
    const b = $("#micBtn"); if(b){ b.disabled = false; b.textContent = "🎤 Speak"; }
    if(!handled){ say("I can't hear you!", "Seni duyamadım. Tekrar dene."); }
  };
  try{ r.start(); }catch(e){ rec = null; btn.disabled = false; btn.textContent = "🎤 Speak"; }
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act],.opt,.tile,#card"); if(!b) return;
  const ov = b.closest(".overlay"); if(ov) ov.remove();
  const act = b.dataset.act, arg = b.dataset.arg;
  if(b.id==="card"){ b.classList.toggle("flip"); return; }
  if(b.classList.contains("tile")){ if(play.solved) return; const i=+b.dataset.i, o=play.order;
    o.picked = o.picked.includes(i) ? o.picked.filter(x=>x!==i) : o.picked.concat(i); renderOrder(); return; }
  if(b.classList.contains("opt")) return answerOpt(b);
  const t = play && play.kind==="quiz" ? tasksOf()[play.task] : null;
  switch(act){
    case "close": return;
    case "leave": stopSpeech(); return;
    case "logout": return parentLogout();
    case "childOut": return childOut();
    case "pickChild": return enterChild(+arg);
    case "addOpen": addOpen = true; render(); setTimeout(()=>$("#cn") && $("#cn").focus(), 50); return;
    case "addClose": addOpen = false; render(); return;
    case "importLocal": return importLocal(arg);
    case "skipLocal": return skipLocal(arg);
    case "delChild": { const c = auth.children.find(x=>x.id === +arg); $("#del-"+arg).innerHTML = `<span class="confirm"><span>${esc(c.name)} ve tüm ilerlemesi silinsin mi?</span><button class="btn small" data-act="delChildYes" data-arg="${arg}">Evet, sil</button><button class="btn ghost small" data-act="delNo">Vazgeç</button></span>`; return; }
    case "delChildYes": api("/children/"+arg, {method:"DELETE"}).then(()=>{ auth.children = auth.children.filter(x=>x.id !== +arg); saveAuth(); try{ localStorage.removeItem(cacheKey(+arg)); }catch(e){} toast("Profil silindi."); render(); }).catch(e=>toast(e.message)); return;
    case "delNo": render(); return;
    case "delAccount": $("#delAcc").innerHTML = `<form id="delForm" class="stack" novalidate><div class="fb try">Veli hesabın ve bütün çocuk profilleri kalıcı olarak silinir. Bu işlem geri alınamaz.</div><label for="dp">Onaylamak için şifreni yaz</label><input class="field" id="dp" type="password" autocomplete="current-password"><div id="delMsg" role="alert"></div><div class="row"><button class="btn small" type="submit">Hesabımı kalıcı olarak sil</button><button class="btn ghost small" type="button" data-act="delNo">Vazgeç</button></div></form>`; return;
    case "avatar": if(!S){ regAvatar = arg; document.querySelectorAll(".avas button").forEach(x=>x.classList.toggle("on", x.dataset.arg===arg)); return; } S.avatar = arg; save(); updateTop(); document.querySelectorAll(".avas button").forEach(x=>x.classList.toggle("on", x.dataset.arg===arg)); if(page==="profile") render(); say("Nice choice!", `${arg} çok yakıştı!`); return;
    case "startStep": { const [i,k] = arg.split(":"); return startStep(+i, k); }
    case "sayText": return speak(arg);
    case "insert": { const ta = $("#wt"); if(!ta) return; const a = ta.selectionStart ?? ta.value.length, b2 = ta.selectionEnd ?? a;
      const before = ta.value.slice(0,a), sp = before && !/\s$/.test(before) ? " " : "";
      ta.value = before + sp + arg + " " + ta.value.slice(b2); const pos = (before+sp+arg+" ").length; ta.focus(); ta.setSelectionRange(pos,pos);
      S.writings[play.unit] = Object.assign({}, S.writings[play.unit], {draft:ta.value}); save(); liveWrite(); return; }
    case "showModel": { const m = $("#model"); m.hidden = !m.hidden; return; }
    case "readMine": { const t2 = ($("#wt").value||"").trim(); if(!t2){ say("Write something first!","Önce bir şeyler yaz!"); return; } return speak(t2); }
    case "submitWrite": return submitWrite();
    case "sing": return sing();
    case "pickSong": stopSpeech(); play.songIdx = +arg; render(); say(`Song ${+arg+1}: ${LEVELS[play.unit].songs[+arg].title}`, "Önce 🔊 Sing along'a bas, sonra sen de söyle!"); return;
    case "finishSong": {
      const i = play.unit, sg = S.sung[i] = S.sung[i] || [], k = play.songIdx;
      stopSpeech();
      if(!sg.includes(k)){ sg.push(k); addPts(2); say("Beautiful singing! ⭐ +2", `Harika söyledin! ${sg.length}/5 şarkı tamam.`); }
      if(sg.length >= 5 && !S.lessons["s"+i]){ S.lessons["s"+i] = true; addPts(5); confetti(); say("All 5 songs! ⭐ +5 bonus!", "Beş şarkının hepsini söyledin! Sıradaki ders: Kelime Kartları."); toast("🎵 Şarkı dersi tamam! +5 ⭐"); }
      const nextK = [0,1,2,3,4].find(n=>!sg.includes(n));
      if(nextK !== undefined){ play.songIdx = nextK; render(); return; }
      return startStep(i, S.lessons["c"+i] ? (easyDone(i) ? "hard" : "easy") : "cards");
    }
    case "prevCard": case "nextCard":
      { const n = LEVELS[play.unit].cards.length; play.cardIdx = (play.cardIdx + (act==="nextCard"?1:n-1)) % n; } play.seen.add(play.cardIdx); render(); return;
    case "finishCards": {
      const i = play.unit;
      if(!S.lessons["c"+i]){ S.lessons["c"+i] = true; addPts(5); }
      return startStep(i, easyDone(i) ? "hard" : "easy");
    }
    case "reset": $("#resetRow").innerHTML = `<div class="confirm"><span>Bu hesabın bütün yıldızları, dersleri ve rozetleri silinsin mi?</span><button class="btn small" data-act="resetYes">Evet, sil</button><button class="btn ghost small" data-act="resetNo">Vazgeç</button></div>`; return;
    case "resetYes": S = Object.assign(blankData(), {name:S.name, avatar:S.avatar}); save(); go("home"); toast("İlerleme sıfırlandı."); return;
    case "resetNo": render(); return;
    case "nextTask": return nextTask();
    case "readAll": return readStory();
    case "readSlow": return readStory(.55);
    case "readLine": { stopSpeech(); document.querySelectorAll("#story .line").forEach((p,n)=>p.classList.toggle("on", n === +arg)); return speak(READING[sk.unit].lines[+arg][0], ()=>{ const l = document.querySelectorAll("#story .line")[+arg]; if(l) l.classList.remove("on"); }); }
    case "toggleTr": sk.showTr = !sk.showTr; { const y = window.scrollY; stopSpeech(); render(); window.scrollTo({top:y}); } return;
    case "skAns": return sk.type==="reading" ? readAnswer(b, +arg) : listenAnswer(b);
    case "skPlay": return speak(sk.type==="listening" ? LISTENING[sk.unit][sk.idx].say : SPEAKING[sk.unit][sk.idx].en);
    case "skSlow": return speak(sk.type==="listening" ? LISTENING[sk.unit][sk.idx].say : SPEAKING[sk.unit][sk.idx].en, null, .5);
    case "skNext": return skNext();
    case "mic": return startMic();
    case "skSaid": if(!sk.solved) skCorrect(SR && !sk.noMic ? 2 : 3, `“${esc(SPEAKING[sk.unit][sk.idx].en)}” <span class="tr">Konuşman harikaydı!</span>`); return;
    case "play": return speak(t.say || t.word || t.sentence);
    case "slow": return speak(t.say || t.word, null, .5);
    case "showTxt": { const x=$("#txt"); x.hidden=!x.hidden; return; }
    case "said": return correct(`Wonderful speaking! <span class="tr">Konuşman harikaydı!</span>`);
    case "reveal": $("#reveal").innerHTML = revealHTML(true,t); speak(t.answer); say("Did you say it like this?","Sen de böyle mi söyledin?"); return;
    case "gotIt": return correct(`“${esc(t.answer)}” <span class="tr">Türkçeden İngilizceye çevirdin, bu çok zor bir iş!</span>`);
    case "notYet": play.tries++; $("#reveal").innerHTML = revealHTML(false,t); say("That's OK! Try again.","Sorun değil! Cevabı aklında tut ve bir daha söyle."); return;
    case "clearOrder": if(!play.solved){ play.order.picked=[]; renderOrder(); } return;
    case "checkOrder": {
      if(play.solved) return;
      const s = play.order.picked.map(i=>play.order.tiles[i]).join(" ");
      if(!s){ say("Tap the words first!","Önce kelimelere dokun!"); return; }
      if(norm(s)===norm(t.answer)){ correct(`“${esc(t.answer)}.” <span class="tr">${esc(t.tr)}</span>`); speak(t.answer); }
      else wrong(t);
      return;
    }
  }
});
function answerOpt(b){
  if(!play || play.solved) return;
  const L = LEVELS[play.unit], t = tasksOf()[play.task];
  if(b.dataset.v === (t.type==="song" ? t.blank : t.answer)){
    b.classList.add("right");
    if(t.type==="song"){ $("#sline").innerHTML = L.song.lines[t.line]; correct(`“${plain(L.song.lines[t.line])}”`); }
    else { correct(""); speak(PRAISE[0][0]); }
  } else { b.classList.add("wrong"); setTimeout(()=>b.classList.remove("wrong"),600); wrong(t); }
}
document.addEventListener("keydown", e => {
  if(e.target.id==="card" && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); e.target.classList.toggle("flip"); }
});
document.addEventListener("input", e => {
  if(e.target.id==="wq"){ wq = e.target.value; renderWords(); }
  if(e.target.id==="wt" && play){ S.writings[play.unit] = Object.assign({}, S.writings[play.unit], {draft:e.target.value}); save(); liveWrite(); }
});
document.addEventListener("change", e => { if(e.target.id==="wu"){ wu = e.target.value; renderWords(); } });
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = {loginForm:onLogin, regForm:onRegister, childForm:onAddChild, pwForm:onChangePw, delForm:onDeleteAccount}[e.target.id];
  if(f){ const btn = e.target.querySelector('[type="submit"]'); btn.disabled = true; f().finally(()=>{ btn.disabled = false; }); return; }
  if(!play || play.solved) return;
  const L = LEVELS[play.unit], t = tasksOf()[play.task], inp = $("input.write");
  const v = norm(inp.value);
  if(!v){ say("Type the word first!","Önce kelimeyi yaz!"); return; }
  const ans = t.type==="songtype" ? t.blank : t.type==="dictation" ? t.word : t.answer;
  if(v === ans || (t.alts||[]).includes(v)){
    inp.style.borderColor="var(--leaf)";
    if(t.type==="songtype"){ $("#sline").innerHTML = L.song.lines[t.line]; correct(`“${plain(L.song.lines[t.line])}”`); speak(plain(L.song.lines[t.line])); }
    else if(t.type==="dictation"){ $("#dictEmo").textContent = t.e; correct(`${t.e} <b>${esc(t.word)}</b>`); speak(t.word); }
    else { const full = t.sentence.replace("___",t.answer); correct(`“${esc(full)}”`); speak(full); }
  } else wrong(t);
});
function sing(){
  if(singing){ stopSpeech(); document.querySelectorAll("#song p").forEach(p=>p.classList.remove("on")); return; }
  const ps = [...document.querySelectorAll("#song p")], lines = LEVELS[play.unit].songs[play.songIdx||0].lines.map(plain);
  singing = true; let i = 0;
  const step = () => {
    ps.forEach(p=>p.classList.remove("on"));
    if(!singing || i>=lines.length || !document.body.contains(ps[0])){ singing=false; return; }
    ps[i].classList.add("on"); speak(lines[i], ()=>{ i++; setTimeout(step, 250); });
  };
  say("Sing with me! 🎤","Benimle söyle! Alkışla ritim tut 👏👏");
  step();
}

if(auth && auth.lastChild && auth.children.some(c=>c.id === auth.lastChild)) enterChild(auth.lastChild); else route();
if(auth) refreshMe();
</script>
