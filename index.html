function readingHTML(){
  if(!unitOpen(sk.unit)) return skLocked();
  const i = sk.unit, R = READING[i], d = skDone("reading", i);
  return `${skBack()}<section class="panel">
    <div class="eyebrow">Ünite ${i+1} · ${LEVELS[i].theme} · Reading</div>
    <h1>${R.e} ${esc(R.title)}</h1>
    <div class="row"><button class="btn" data-act="readAll">🔊 Read to me</button><button class="btn ghost small" data-act="readSlow">🐢 Slow</button><button class="btn ghost small" data-act="toggleTr">🇹🇷 ${sk.showTr?"Türkçeyi gizle":"Türkçesini göster"}</button></div>
    <div class="story" id="story">${R.lines.map((l,n)=>`<button type="button" class="line" data-act="readLine" data-arg="${n}">${esc(l[0])}${sk.showTr?`<span class="tr">${esc(l[1])}</span>`:""}</button>`).join("")}</div>
    <p class="tr">Bir cümleye dokun, Ollie sana okusun. Bilmediğin kelimeler için Türkçesine bakabilirsin.</p>
  </section>
  <section class="panel"><h2>Questions <span class="tr">· Sorular · <span id="rcount">${d.length}</span>/${R.qs.length} doğru</span></h2>
    ${R.qs.map((q,n)=>{ const ok = sk.answered[n];
      return `<div class="stack rq"><div class="q" style="font-size:1.2rem">${n+1}. ${esc(q.q)} <span class="tr">${esc(q.tr)}</span></div>
        <div class="opts">${q.options.map(o=>`<button class="ans ${ok && o===q.answer?"right":""}" data-act="skAns" data-arg="${n}" data-v="${esc(o)}" ${ok?"disabled":""}>${esc(o)}</button>`).join("")}</div>
        <div id="rfb-${n}"></div></div>`; }).join("")}
    <div id="rdone"></div>
  </section>`;
}
function readStory(rate){
  if(singing){ stopSpeech(); document.querySelectorAll("#story .line").forEach(p=>p.classList.remove("on")); return; }
  const ls = [...document.querySelectorAll("#story .line")], lines = READING[sk.unit].lines;
  singing = true; let n = 0;
  const step = () => {
    ls.forEach(p=>p.classList.remove("on"));
    if(!singing || n>=lines.length || !document.body.contains(ls[0])){ singing = false; return; }
    ls[n].classList.add("on"); speak(lines[n][0], ()=>{ n++; setTimeout(step, 300); }, rate);
  };
  step();
}
function readAnswer(b, n){
  const i = sk.unit, R = READING[i], q = R.qs[n];
  if(sk.answered[n]) return;
  if(b.dataset.v === q.answer){
    sk.answered[n] = true;
    const r = skAward("reading", i, n, sk.tries[n] ? 2 : 5);
    b.classList.add("right"); b.parentNode.querySelectorAll("button").forEach(x=>x.disabled = true);
    const rc = $("#rcount"); if(rc) rc.textContent = skDone("reading", i).length;
    const p = PRAISE[Math.floor(Math.random()*PRAISE.length)];
    $("#rfb-"+n).innerHTML = `<div class="fb good">${p[0]} ⭐ +${r.pts}</div>`;
    say(`${p[0]} ⭐ +${r.pts}`, `${p[1]} ${r.pts} yıldız kazandın!`);
    if(Object.keys(sk.answered).length === R.qs.length){
      $("#rdone").innerHTML = `<div class="fb good"><div class="en">🏆 Story complete!${r.bonus?" ⭐ +5 bonus":""}</div><div class="tr">Hikâyeyi bitirdin, bütün soruları doğru cevapladın!</div></div>
        <div class="row center" style="margin-top:12px"><a class="btn ghost" href="#reading">📕 Hikâyeler</a>${i<LEVELS.length-1 && unitOpen(i+1)?`<a class="btn" href="#reading-${i+2}">Sonraki hikâye ▶</a>`:""}</div>`;
      speak("Great reading! You finished the story!");
    }
  } else {
    sk.tries[n] = (sk.tries[n]||0) + 1;
    b.classList.add("wrong"); setTimeout(()=>b.classList.remove("wrong"), 600);
    $("#rfb-"+n).innerHTML = `<div class="fb try">Not quite! Read the story again. 🔍 <span class="tr">Cevap hikâyenin içinde, bir daha oku!</span></div>`;
    say("Good try! Look at the story again.", "Güzel deneme! Hikâyeye bir daha bak.");
  }
}

/* ---------- Seviyeli okuma kütüphanesi ----------
   BOOKS: 5 seviyede kısa resimli kitaplar (1–3 Starters, 4 Movers, 5 Flyers; 4–5 books-mf.js’te). Her kitap bir üniteye bağlı (o ünite açılınca okunur).
   Okuyucu sayfa sayfa gider; her kelimeye dokununca Ollie okur ve Türkçesini söyler. Sonunda kısa test.
   İlerleme: S.books[id] = {n: kaç kez bitirdi, q: ilk denemede doğru (en iyi), d: son okuma günü}. */
const BOOK_LV = [null,
  {e:"🌱", n:"Seviye 1", tr:"Başlangıç", d:"Kısa kitaplar: her sayfada tek bir kısa cümle."},
  {e:"🌿", n:"Seviye 2", tr:"Gelişen okur", d:"Her sayfada bir iki cümle, yeni kelimeler."},
  {e:"🌳", n:"Seviye 3", tr:"Usta okur", d:"Daha uzun hikâyeler ve konuşmalar."},
  {e:"🍎", n:"Seviye 4", tr:"Meraklı okur", d:"Movers kitapları: 8 sayfa, karşılaştırmalar ve geçmiş zaman."},
  {e:"🌟", n:"Seviye 5", tr:"Kitap kurdu", d:"Flyers kitapları: 10 sayfa, planlar, masallar, “neden” soruları."}];
const bookLevels = () => BOOK_LV.map((_,lv)=>lv).filter(lv => lv && BOOKS.some(b=>b.lv===lv));
const BOOK_GOAL = 4;   // bir seviyede bu kadar kitap okuyan o seviyenin okuru olur
const BASIC_TR = {a:"bir", an:"bir", the:"(belirli tanımlık)", i:"ben", you:"sen / siz", he:"o (erkek)", she:"o (kız)", it:"o (eşya, hayvan)",
  we:"biz", they:"onlar", is:"-dir (he/she/it)", are:"-dir (we/you/they)", am:"-im (I)", and:"ve", but:"ama", in:"içinde", on:"üstünde",
  at:"-de / -da", to:"-e / -a", my:"benim", his:"onun (erkek)", her:"onun (kız) / onu", its:"onun", our:"bizim", their:"onların", this:"bu",
  that:"şu / o", can:"-ebilir", "can’t":"-emez", yes:"evet", no:"hayır", not:"değil", with:"ile", of:"-in", has:"-si var (he/she/it)",
  have:"-im var / sahip olmak", do:"yapmak", does:"yapar", look:"bak", what:"ne", where:"nerede", who:"kim", very:"çok", too:"de / da, çok",
  so:"bu yüzden / çok", now:"şimdi", here:"burada", there:"orada", oh:"ah, oh", me:"beni / bana", him:"onu (erkek)", them:"onları",
  us:"bizi", your:"senin", one:"bir", two:"iki", three:"üç", up:"yukarı", wake:"uyanmak", teeth:"dişler", brush:"fırçalamak",
  go:"gitmek", eat:"yemek", white:"beyaz", black:"siyah", orange:"turuncu", eraser:"silgi", desk:"sıra", teacher:"öğretmen",
  grandma:"büyükanne", grandpa:"büyükbaba", morning:"sabah", night:"gece", like:"sevmek", hungry:"aç", umbrella:"şemsiye", kite:"uçurtma",
  snowman:"kardan adam", head:"baş", feet:"ayaklar", mouth:"ağız", wear:"giymek", cold:"soğuk", warm:"sıcak", play:"oynamak",
  football:"futbol", seven:"yedi", "o’clock":"saat (tam)", friend:"arkadaş", team:"takım", climb:"tırmanmak", fly:"uçmak", jump:"zıplamak"};
let bk = null;
const bookById = id => BOOKS.find(b=>b.id===id);
const bookRead = b => !!(S.books[b.id] && S.books[b.id].n);
const bookCount = () => BOOKS.filter(bookRead).length;
const bookLvCount = lv => BOOKS.filter(b=>b.lv===lv && bookRead(b)).length;
const readerLevel = () => bookLevels().reverse().find(lv => bookLvCount(lv) >= Math.min(BOOK_GOAL, BOOKS.filter(b=>b.lv===lv).length)) || 0;
function nextBook(){
  const open = BOOKS.filter(b=>unitOpen(b.u) && !bookRead(b));
  return open.sort((a,b)=>a.lv-b.lv || a.u-b.u)[0] || null;
}
function glossOf(raw, b){
  const w = raw.toLowerCase().replace(/'/g,"’");
  const look = x => b.g && b.g[x] || WORDS[x] && WORDS[x].c.tr.toLowerCase() || EXTRA_TR[x] || BASIC_TR[x];
  return look(w) || look(w.replace(/’s$/,"")) || look(w.replace(/es$/,"")) || look(w.replace(/s$/,"")) || "";
}
function bookWords(text){
  return text.split(/\s+/).map(tok=>{
    const m = tok.match(/^([^A-Za-z’']*)([A-Za-z’'-]*[A-Za-z])([^A-Za-z]*)$/);
    return m ? `${esc(m[1])}<button type="button" class="bw" data-act="bkWord" data-arg="${esc(m[2])}">${esc(m[2])}</button>${esc(m[3])}` : esc(tok);
  }).join(" ");
}

  </section>

      <div class="grid g3">${list.map(b=>{ const open = unitOpen(b.u), r = S.books[b.id];

        return `<a class="unit book ${open?"":"locked"}" href="#book-${b.id}" ${open?"":'aria-disabled="true"'}>
          <div class="top"><span class="ic">${b.e}</span><div style="min-width:0"><div class="no">${L.e} ${L.n} · ${LEVELS[b.u].theme}</div><div class="nm">${esc(b.t)}</div><div class="tr">${b.pages.length} sayfa · ${b.qs.length} soru</div></div></div>
          <div class="meta"><span>${st}</span><span>${r && r.n ? `⭐ ${r.q}/${b.qs.length}` : ""}</span></div></a>`; }).join("")}</div></section>`; }).join("")}`;
}
function startBook(id){
  const b = bookById(id); if(!b) return false;

const skipHTML = () => `<div class="row center"><span class="tr">Ollie seni anlamakta zorlanıyor olabilir.</span><button class="btn ghost small" data-act="skSaid">Doğru söyledim, geç ▶</button></div>`;
const NUMW = {"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","11":"eleven","12":"twelve"};

    $("#heard").innerHTML = `<div class="say heard">${best.words.map(w=>`<span class="hw ${w.ok?"ok":"no"}">${esc(w.w)}</span>`).join(" ")}</div>

    case "chatRetry": return startChat(ct.unit);
    case "parentChats": return parentChats(+arg);
    case "clearChats": return clearChats(+arg);
    case "skSaid": if(!sk.solved) skCorrect(SR && !sk.noMic ? 2 : 3, `“${esc(SPEAKING[sk.unit][sk.idx].en)}” <span class="tr">Konuşman harikaydı!</span>`); return;
    case "play": return speak(t.say || t.word || t.sentence);
    case "slow": return speak(t.say || t.word, null, .5);
    case "showTxt": { const x=$("#txt"); x.hidden=!x.hidden; return; }
    case "said": return correct(`Wonderful speaking! <span class="tr">Konuşman harikaydı!</span>`);
    case "reveal": $("#reveal").innerHTML = revealHTML(true,t); speak(t.answer); say("Did you say it like this?","Sen de böyle mi söyledin?"); return;
    case "gotIt": return correct(`“${esc(t.answer)}” <span class="tr">Türkçeden İngilizceye çevirdin, bu çok zor bir iş!</span>`);
    case "notYet": play.tries++; $("#reveal").innerHTML = revealHTML(false,t); say("That's OK! Try again.","Sorun değil! Cevabı aklında tut ve bir daha söyle."); return;
    case "clearOrder": if(!play.solved){ play.order.picked = play.order.picked.slice(0, play.order.lock||0); renderOrder(); } return;
    case "chOff": if(play && !play.solved){ play.ch = false; $("#screen").innerHTML = quizHTML(); say("OK! Pick one.", "Tamam, seçeneklerden seç."); } return;
    case "hintAsk": { if(!play || play.solved || !t || !t.hint) return;
      if(play.tries===0){ play.tries = 1; play.missN = (play.missN||0) + 1; if(adCounts(t)) adRec(0); revMiss(play.unit, t); save(); }
      $("#hintRow")?.remove();
      $("#fb").innerHTML = `<div class="fb try"><div class="en">💡 ${esc(t.hint[0])}</div><div class="tr">${esc(t.hint[1])}</div></div>`;
      say("Here's a clue!", "İşte ipucun. Şimdi sen dene!"); return; }
    case "checkOrder": {
      if(play.solved) return;
      const s = play.order.picked.map(i=>play.order.tiles[i]).join(" ");
      if(!s){ say("Tap the words first!","Önce kelimelere dokun!"); return; }
      if(norm(s)===norm(t.answer)){ correct(`“${esc(t.answer)}.” <span class="tr">${esc(t.tr)}</span>`); speak(t.answer); }
      else wrong(t, play.order.picked.map(i=>play.order.tiles[i]));
      return;
    }
  }
});
function answerOpt(b){
  if(!play || play.solved) return;
  const L = LEVELS[play.unit], t = tasksOf()[play.task];
  if(b.dataset.v === (t.type==="song" ? t.blank : t.answer)){
    b.classList.add("right");
    if(t.type==="song"){ $("#sline").innerHTML = L.song.lines[t.line]; correct(`“${plain(L.song.lines[t.line])}”`); }
    else { correct(""); speak(PRAISE[0][0]); }
  } else { b.classList.add("wrong"); setTimeout(()=>b.classList.remove("wrong"),600); wrong(t, b.dataset.v); }
}
document.addEventListener("keydown", e => {
  if(e.target.id==="card" && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); e.target.classList.toggle("flip"); }
});
document.addEventListener("input", e => {
  if(e.target.id==="wq"){ wq = e.target.value; renderWords(); }
  if(e.target.id==="exEssay" && ex){ ex.text = e.target.value; exLive(); }
  if(e.target.id==="wt" && play){ S.writings[play.unit] = Object.assign({}, S.writings[play.unit], {draft:e.target.value}); save(); liveWrite(); }
});
document.addEventListener("change", e => {
  if(e.target.id==="wu"){ wu = e.target.value; renderWords(); }
  if(e.target.id==="sheetUnit"){ sheetSeed = 0; go("sheet-" + e.target.value); }
  if(e.target.id==="sheetKey"){ sheetKey = e.target.checked; showSheet(sheetUnit); }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = {loginForm:onLogin, regForm:onRegister, forgotForm:onForgot, resetForm:onReset, childForm:onAddChild, pwForm:onChangePw, delForm:onDeleteAccount}[e.target.id];
  if(f){ const btn = e.target.querySelector('[type="submit"]'); btn.disabled = true; f().finally(()=>{ btn.disabled = false; }); return; }
  if(e.target.id==="exForm"){ const v = $("#exIn").value; if(!norm(v)){ say("Type your answer first!","Önce cevabını yaz! Bilmiyorsan 🤷 düğmesine bas."); return; } return exAnswer(v.trim()); }
  if(e.target.id==="chatForm"){ const v = $("#chatIn").value; if(!v.trim()){ say("Write something first!","Önce bir şey yaz ya da 🎤 ile konuş!"); return; } return chatSend(v); }
  if(e.target.id==="rvForm"){ const v = $("#rvIn").value; if(!norm(v)){ say("Type the word first!","Önce kelimeyi yaz!"); return; } return revAnswer(v); }
  if(!play || play.solved) return;
  const L = LEVELS[play.unit], t = tasksOf()[play.task], inp = $("input.write");
  const v = norm(inp.value);
  if(!v){ say("Type the word first!","Önce kelimeyi yaz!"); return; }
  if(play.ch){
    if(v === chAns(t) || v === norm(t.type==="song" ? t.blank : t.answer)){
      inp.style.borderColor="var(--leaf)";
      if(t.type==="song"){ $("#sline").innerHTML = L.song.lines[t.line]; correct(`“${plain(L.song.lines[t.line])}”`); speak(plain(L.song.lines[t.line])); }
      else { correct(`<b>${esc(t.answer)}</b>`); speak(t.answer); }
    } else wrong(t, inp.value);
    return;
  }
  const ans = t.type==="songtype" ? t.blank : t.type==="dictation" ? t.word : t.answer;
  if(v === ans || (t.alts||[]).includes(v)){
    inp.style.borderColor="var(--leaf)";
    if(t.type==="songtype"){ $("#sline").innerHTML = L.song.lines[t.line]; correct(`“${plain(L.song.lines[t.line])}”`); speak(plain(L.song.lines[t.line])); }
    else if(t.type==="dictation"){ $("#dictEmo").textContent = t.e; correct(`${t.e} <b>${esc(t.word)}</b>`); speak(t.word); }
    else { const full = t.sentence.replace("___",t.answer); correct(`“${esc(full)}”`); speak(full); }
  } else wrong(t, inp.value);
});
function sing(){
  if(singing){ stopSpeech(); document.querySelectorAll("#song p").forEach(p=>p.classList.remove("on")); return; }
  const ps = [...document.querySelectorAll("#song p")], lines = LEVELS[play.unit].songs[play.songIdx||0].lines.map(plain);
  singing = true; let i = 0;
  const step = () => {
    ps.forEach(p=>p.classList.remove("on"));
    if(!singing || i>=lines.length || !document.body.contains(ps[0])){ singing=false; return; }
    ps[i].classList.add("on"); speak(lines[i], ()=>{ i++; setTimeout(step, 250); });
  };
  say("Sing with me! 🎤","Benimle söyle! Alkışla ritim tut 👏👏");
  step();
}

if(!/^#(reset|verify)-/.test(location.hash) && auth && auth.lastChild && auth.children.some(c=>c.id === auth.lastChild)) enterChild(auth.lastChild); else route();
if(auth) refreshMe();
</script>
