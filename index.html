<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ollie Akademi</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: online-classroom shell — sidebar nav (bottom tab bar on phones) + main column: Ollie's speech strip, then the page (dashboard, units, unit, dictionary, badges, profile) or the lesson player. */
:root{
  --bg:#EDF4E8; --surface:#FFFFFF; --soft:#F7F1E4; --ink:#22304A; --muted:#5E6A7C; --line:#D6E2D0;
  --accent:#E8742A; --accent-2:#C95E18; --on-accent:#FFFFFF;
  --sun:#FFC43B; --leaf:#2C9A66; --leaf-soft:#DDF3E7; --berry:#D2486A; --berry-soft:#FBE3E9; --sky:#3B7DDD; --sky-soft:#E1ECFB;
  --owl:#9B6338; --owl-dark:#6E4423; --belly:#F4DAB0; --eye:#FFFFFF; --pupil:#22304A; --beak:#FFB627;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121933; --surface:#1C2546; --soft:#232E57; --ink:#F1F3FA; --muted:#A9B3CD; --line:#2F3A66;
  --accent:#FF9149; --accent-2:#FFAA70; --on-accent:#1A1206;
  --sun:#FFD15A; --leaf:#4CC58D; --leaf-soft:#1C3B3A; --berry:#FF7C98; --berry-soft:#3D2340; --sky:#7FB0FF; --sky-soft:#22305E;
  --owl:#B87A4B; --owl-dark:#8A5530; --belly:#F1D6A9; --eye:#FFFFFF; --pupil:#121933; --beak:#FFC43B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121933; --surface:#1C2546; --soft:#232E57; --ink:#F1F3FA; --muted:#A9B3CD; --line:#2F3A66;
  --accent:#FF9149; --accent-2:#FFAA70; --on-accent:#1A1206;
  --sun:#FFD15A; --leaf:#4CC58D; --leaf-soft:#1C3B3A; --berry:#FF7C98; --berry-soft:#3D2340; --sky:#7FB0FF; --sky-soft:#22305E;
  --owl:#B87A4B; --owl-dark:#8A5530; --belly:#F1D6A9; --eye:#FFFFFF; --pupil:#121933; --beak:#FFC43B;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.9rem} h2{font-size:1.45rem} h3{font-size:1.15rem}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,.card3d:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.tr{color:var(--muted);font-size:.86em}
.muted{color:var(--muted)}

/* Shell */
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:max(230px,14.5rem) minmax(0,1fr);gap:22px;align-items:start}
.side{position:sticky;top:12px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px 12px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:1.3rem;padding:4px 8px 12px;text-decoration:none}
.brand small{display:block;font-weight:500;font-size:.75rem;color:var(--muted);letter-spacing:.04em}
.brand .mini{width:48px;height:48px;object-fit:contain}
.side .brand{gap:6px;padding-left:2px;padding-right:2px}.brand>span{white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;text-decoration:none;font-weight:800;color:var(--muted)}
.nav a .i{font-size:1.3rem;width:28px;text-align:center}
.nav a:hover{background:var(--soft);color:var(--ink)}
.nav a.on{background:var(--soft);color:var(--ink);box-shadow:inset 4px 0 0 var(--accent)}
.nav .sm{display:none}
.side .me{margin-top:10px;border-top:2px dashed var(--line);padding-top:12px;display:flex;gap:10px;align-items:center}
.ava{width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:1.5rem;flex:none;border:2px solid var(--line)}
.main{min-width:0;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar .brand{display:none;padding:0;margin-right:auto}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.star{border-color:var(--sun)}
.pill .lbl{font-weight:600;color:var(--muted);font-size:.85em}
.bump{animation:bump .45s ease}
@keyframes bump{40%{transform:scale(1.18)}}

/* Ollie strip */
.ollie{display:flex;align-items:center;gap:14px}
.owl{width:88px;height:88px;flex:none;object-fit:contain}
.owl.hop{animation:hop .5s ease}
@keyframes hop{30%{transform:translateY(-10px) rotate(-4deg)}60%{transform:translateY(0) rotate(3deg)}}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 16px}
.bubble::before{content:"";position:absolute;left:-10px;top:26px;width:16px;height:16px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble .en{font-family:var(--display);font-weight:500;font-size:1.1rem}

/* Generic */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font-family:var(--display);font-weight:600;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.center{justify-content:center}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:600;font-size:1.05rem;padding:11px 20px;border-radius:16px;box-shadow:0 4px 0 var(--accent-2);transition:transform .1s;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-2)}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.small{font-size:.92rem;padding:7px 13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{font-weight:800;color:var(--accent-2);text-decoration:none}
.link:hover{text-decoration:underline}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:99px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--soft);border-radius:16px;padding:14px 16px}
.stat b{display:block;font-family:var(--display);font-weight:600;font-size:1.7rem;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-weight:600;font-size:.9rem}

/* Dashboard */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--line);stroke-width:12}
.ring .fill{fill:none;stroke:var(--sun);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;line-height:1.1}
.ring .lbl b{font-family:var(--display);font-size:1.6rem;display:block}
.chatbox{display:flex;flex-direction:column;gap:12px}
.clog{display:flex;flex-direction:column;gap:12px;max-height:60vh;overflow-y:auto;padding:4px 2px}
.cmsg{display:flex;flex-direction:column;max-width:85%}
.cmsg.ollie{flex-direction:row;gap:8px;align-self:flex-start;align-items:flex-start}
.cmsg.me{align-self:flex-end;align-items:flex-end}
.cava{font-size:1.8rem;line-height:1}
.cb{background:var(--soft);border-radius:18px;padding:10px 14px;font-size:1.1rem;overflow-wrap:anywhere}
.cmsg.me .cb{background:var(--accent);color:var(--on-accent)}
.cb .tr{margin-top:6px}
.cb.typing{letter-spacing:3px;font-weight:700}
.cact{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.cfix{margin-top:6px;background:var(--leaf-soft);border:2px solid var(--leaf);border-radius:14px;padding:6px 12px;max-width:100%}
.cfix .tr{display:block}
.crow{display:flex;gap:8px;align-items:center}
.crow .field{max-width:none;flex:1;min-width:0}
#chatMic.on{background:var(--berry-soft)}
.pchat{border:2px solid var(--line);border-radius:14px;padding:8px 12px;margin-top:8px}
.pchat summary{cursor:pointer}
.pline{padding:4px 0;overflow-wrap:anywhere}
.continue{display:flex;gap:14px;align-items:center;background:var(--soft);border-radius:18px;padding:14px 16px;flex-wrap:wrap}
.continue .ic{font-size:2.2rem}
.continue .txt{flex:1;min-width:160px}
.continue.review{margin-top:10px}
.rvopt{font-size:1.2rem;padding:14px}
.rvopt .emo{font-size:2.6rem}
.rvopt.right{background:var(--leaf-soft);border-color:var(--leaf)}
.rvopt.wrong{animation:shake .4s}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:.85rem;color:var(--muted)}
.week i{width:34px;height:34px;border-radius:50%;background:var(--soft);border:2px solid var(--line);display:grid;place-items:center;font-style:normal}
.week .yes i{background:var(--sun);border-color:var(--sun)}
.week .now{color:var(--ink)}
.avas{display:flex;gap:8px;flex-wrap:wrap}
.avas button{width:52px;height:52px;border-radius:50%;font-size:1.7rem;background:var(--soft);border:3px solid transparent}
.avas button.on{border-color:var(--accent)}
.field{font-family:var(--body);font-size:1.1rem;padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%;max-width:340px}
.field:focus{border-color:var(--accent);outline:none}

/* Units */
.unit{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:20px;border:2px solid var(--line);background:var(--surface);text-decoration:none;min-width:0}
.unit:hover{border-color:var(--accent)}
.unit .top{display:flex;align-items:center;gap:12px}
.unit .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.7rem;background:var(--soft);flex:none}
.unit .nm{font-family:var(--display);font-weight:600;font-size:1.15rem}
.unit .no{font-family:var(--display);font-weight:600;font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.unit.locked{opacity:.55}
.unit.locked:hover{border-color:var(--line)}
.unit .meta{display:flex;justify-content:space-between;font-weight:700;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:99px;padding:3px 12px;font-weight:700;font-size:.9rem}
.chip.ok{background:var(--leaf-soft);color:var(--leaf)}
a.chip{text-decoration:none;color:var(--ink);border:2px solid transparent}
a.chip.on{background:var(--accent);color:var(--on-accent)}
a.chip.mebchip,.mebtag{background:var(--sky-soft);color:var(--sky)}
.mebtag{align-self:flex-start;border-radius:99px;padding:2px 10px;font-weight:700;font-size:.8rem}
.mebus{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.mebu{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--line);border-radius:16px;background:var(--surface);text-decoration:none;color:var(--ink);min-width:0}
.mebu:hover{border-color:var(--accent)}
.mebu.locked{opacity:.6}
.mebu .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.4rem;background:var(--soft);flex:none}
.mebu b{display:block;overflow-wrap:anywhere}
.mebu .tr{display:block}
.mebu .chip{margin-left:auto;flex:none}
.lessons{display:flex;flex-direction:column;gap:10px}
.lesson{display:flex;align-items:center;gap:14px;padding:14px 16px;border:2px solid var(--line);border-radius:18px;flex-wrap:wrap}
.lesson .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;background:var(--soft);flex:none}
.lesson .txt{flex:1;min-width:150px}
.lesson .t{font-family:var(--display);font-weight:600;font-size:1.1rem}
.lesson.done{border-color:var(--leaf)}
.lesson.done .ic{background:var(--leaf-soft)}
.lesson.locked{opacity:.55}
.uhead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.uhead .ic{width:72px;height:72px;border-radius:22px;background:var(--soft);display:grid;place-items:center;font-size:2.4rem;flex:none}

/* Dictionary */
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:12px}
.word{border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.word .e{font-size:2.2rem;line-height:1}
.word .w{font-family:var(--display);font-weight:600;font-size:1.25rem}
.word .ipa{color:var(--accent-2);font-family:var(--display)}
.word .u{font-size:.78rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
select.field{max-width:240px}

/* Badges */
.badge{border:2px solid var(--line);border-radius:20px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;background:var(--surface)}
.badge .e{font-size:2.8rem;line-height:1}
.badge .n{font-family:var(--display);font-weight:600;font-size:1.1rem}
.badge.off .e{filter:grayscale(1);opacity:.35}
.badge.off .n{color:var(--muted)}
.badge.got{border-color:var(--sun)}

/* Lesson player */
.song{display:flex;flex-direction:column;gap:6px;background:var(--soft);border-radius:16px;padding:16px 18px}
.song p{font-family:var(--display);font-weight:500;font-size:1.15rem;padding:2px 8px;border-radius:10px;transition:background .2s}
.song p.on{background:var(--sun);color:#22304A}
.song b{color:var(--accent-2)}
.song p.on b{color:#22304A}
.cardwrap{display:flex;align-items:center;gap:10px;justify-content:center}
.card3d{perspective:900px;width:min(300px,100%);aspect-ratio:3/3.4;max-width:100%;cursor:pointer;border-radius:22px}
.card3d .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card3d.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;border:3px solid var(--ink);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--soft)}
.face .emo{font-size:5rem;line-height:1}
.face .word{font-family:var(--display);font-weight:700;font-size:2rem;letter-spacing:.05em;border:0;padding:0;background:none}
.face .ipa{font-family:var(--display);font-size:1.2rem;color:var(--accent-2)}
.face .ex{font-style:italic}
.face .hint{font-size:.8rem;color:var(--muted)}
.arrow{width:46px;height:46px;border-radius:50%;background:var(--soft);font-size:1.3rem;font-weight:800;flex:none}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.dots i.seen{background:var(--leaf)}
.progress{display:flex;gap:8px}
.progress span{flex:1;height:12px;border-radius:99px;background:var(--line)}
.progress span.done{background:var(--leaf)}
.progress span.now{background:var(--sun)}
.kind{font-family:var(--display);font-weight:600;font-size:1rem;display:inline-flex;gap:8px;align-items:center;background:var(--soft);padding:4px 14px;border-radius:99px;align-self:flex-start}
.q{font-family:var(--display);font-weight:600;font-size:1.45rem}
.songline{font-family:var(--display);font-size:1.3rem;background:var(--soft);padding:14px 16px;border-radius:14px}
.blank{display:inline-block;min-width:80px;border-bottom:3px dashed var(--accent);text-align:center;color:var(--accent-2)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
:is(.opt,.ans){background:var(--surface);border:3px solid var(--line);border-radius:18px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--display);font-weight:600;font-size:1.15rem;min-height:92px;justify-content:center;transition:transform .1s,border-color .15s}
:is(.opt,.ans):hover{border-color:var(--accent)}
:is(.opt,.ans) .emo{font-size:3rem;line-height:1}
:is(.opt,.ans) .sw{width:58px;height:58px;border-radius:50%;border:3px solid var(--ink)}
:is(.opt,.ans).right{border-color:var(--leaf);background:var(--leaf-soft)}
:is(.opt,.ans).wrong{border-color:var(--berry);background:var(--berry-soft);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bigemo{font-size:4.5rem;line-height:1;text-align:center}
.mask{font-family:var(--display);font-weight:700;font-size:1.6rem;letter-spacing:.2em;text-align:center}
.sentence{font-family:var(--display);font-size:1.35rem;text-align:center}
input.write{font-family:var(--display);font-size:1.5rem;padding:12px 16px;border-radius:14px;border:3px solid var(--line);background:var(--surface);color:var(--ink);width:100%;max-width:320px;text-align:center}
input.write:focus{border-color:var(--accent);outline:none}
.say{font-family:var(--display);font-weight:600;font-size:1.5rem;text-align:center;background:var(--soft);padding:18px;border-radius:16px}
.build{min-height:64px;border:3px dashed var(--line);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.build:empty::before{content:"Tap the words below ↓  Aşağıdaki kelimelere dokun";color:var(--muted)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{background:var(--surface);border:2px solid var(--ink);border-radius:12px;padding:8px 14px;font-family:var(--display);font-weight:600;font-size:1.15rem;box-shadow:0 3px 0 var(--line)}
.build .tile{background:var(--sun);color:#22304A;border-color:#22304A}
.chunk{border:2px solid;border-radius:12px;padding:8px 14px;font-family:var(--display);font-weight:600;font-size:1.15rem;color:#22304A;box-shadow:0 3px 0 rgba(0,0,0,.18)}
span.chunk{display:inline-block;box-shadow:none}
.chunk.who{background:#CFE3FF;border-color:#2A66C8}.chunk.does{background:#FFD9B8;border-color:#D0661C}
.chunk.where{background:#CDEFD3;border-color:#2E8B47}.chunk.when{background:#E6D6FA;border-color:#7A4CC2}
.chunk.small{font-size:.95rem;padding:4px 10px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.tower{display:flex;flex-direction:column-reverse;gap:6px;align-items:center}
.floor{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px 10px;border:2px solid var(--line);border-radius:14px;background:var(--soft);max-width:100%}
.floor .n{font-family:var(--display);font-weight:700;color:var(--muted);align-self:center;margin-right:2px}
.trs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.fb{border-radius:16px;padding:14px 16px;font-weight:600}

{"id":"b7","u":3,"lv":2,"t":"Baby’s First Word","e":"👶","pages":[["👦👶","Leo has a baby sister. Her name is Ada.","Leo’nun bir bebek kız kardeşi var. Adı Ada."],["👩👶","Mother says, “Say mama!” But Ada is quiet.","Anne, “Mama de!” der. Ama Ada sessizdir."],["👨👶","Father says, “Say baba!” Ada only laughs.","Baba, “Baba de!” der. Ada sadece güler."],["👵👴👏","Grandma and Grandpa clap, but Ada is still quiet.","Büyükanne ve büyükbaba alkışlar ama Ada hâlâ sessizdir."],["👦👋","Then Leo waves. Ada says, “Leo!”","Sonra Leo el sallar. Ada, “Leo!” der."],["👨‍👩‍👧‍👦😊","Everyone smiles. Leo is very happy!","Herkes gülümser. Leo çok mutlu!"]],"g":{"leo":"Leo (isim)","ada":"Ada (isim)","her":"onun","name":"isim, ad","says":"der","say":"söylemek, demek","mama":"mama (bebek dilinde anne)","baba":"baba (bebek dilinde)","quiet":"sessiz","only":"sadece","laughs":"güler","clap":"alkışlar","still":"hâlâ","then":"sonra","waves":"el sallar","everyone":"herkes","smiles":"gülümser","happy":"mutlu","but":"ama"},"qs":[{"q":"Who is Ada?","tr":"Ada kimdir?","options":["Leo’s baby sister","Leo’s mother","Leo’s grandma"],"answer":"Leo’s baby sister"},{"q":"Who claps?","tr":"Kim alkışlar?","options":["Mother and Father","Leo and Ada","Grandma and Grandpa"],"answer":"Grandma and Grandpa"},{"q":"What is Ada’s first word?","tr":"Ada’nın ilk kelimesi nedir?","options":["Leo","mama","baba"],"answer":"Leo"}]},

{"id":"b9","u":4,"lv":2,"t":"Mert’s Sleepy Morning","e":"😴","pages":[["⏰👦","Mert wakes up at seven o’clock.","Mert saat yedide uyanır."],["😴🛏️","He is very sleepy. He wants to sleep more.","Çok uykulu. Daha çok uyumak ister."],["👩🪥","Mother says, “Brush your teeth, Mert!”","Anne, “Dişlerini fırçala Mert!” der."],["👦🪥👕","Mert brushes his teeth in his pajamas.","Mert dişlerini pijamasıyla fırçalar."],["🍞🥛👨","Mert eats breakfast. Then Father says, “Your pajamas!”","Mert kahvaltı eder. Sonra Baba, “Pijamaların!” der."],["😂🎒🏫","Mert laughs and changes. Then he goes to school.","Mert güler ve üstünü değiştirir. Sonra okula gider."]],"g":{"mert":"Mert (isim)","wakes":"uyanır","up":"yukarı","sleepy":"uykulu","wants":"ister","more":"daha çok","says":"der","your":"senin","brushes":"fırçalar","pajamas":"pijama","eats":"yer","then":"sonra","laughs":"güler","changes":"değiştirir, üstünü değiştirir","goes":"gider"},"qs":[{"q":"What time does Mert wake up?","tr":"Mert saat kaçta uyanır?","options":["at six o’clock","at eight o’clock","at seven o’clock"],"answer":"at seven o’clock"},{"q":"What does Mert wear by mistake?","tr":"Mert yanlışlıkla ne giyer?","options":["pajamas","a coat","a hat"],"answer":"pajamas"},{"q":"What does Mert do at the end?","tr":"Mert sonunda ne yapar?","options":["He sleeps more.","He goes to school.","He eats cheese."],"answer":"He goes to school."}]},

{"id":"b13","u":6,"lv":2,"t":"The Kite and the Rain","e":"🪁","pages":[["🪁💨","It is a windy day. Deniz has a new kite.","Rüzgârlı bir gün. Deniz’in yeni bir uçurtması var."],["🪁⬆️😊","The kite goes up, up, up! Deniz is happy.","Uçurtma yukarı, yukarı, yukarı çıkar! Deniz mutlu."],["☁️🌧️","Then the sky is cloudy. Rain comes.","Sonra gökyüzü bulutlu olur. Yağmur gelir."],["😢🪁💧","Deniz has no umbrella. The kite is wet!","Deniz’in şemsiyesi yok. Uçurtma ıslak!"],["👨☂️","Her father brings a big umbrella.","Babası büyük bir şemsiye getirir."],["👧👨☂️🪁","They hold the umbrella and fly the kite together!","İkisi şemsiyeyi tutar ve uçurtmayı birlikte uçurur!"]],"g":{"day":"gün","deniz":"Deniz (isim)","new":"yeni","goes":"gider, çıkar","up":"yukarı","happy":"mutlu","then":"sonra","sky":"gökyüzü","rain":"yağmur","comes":"gelir","wet":"ıslak","brings":"getirir","big":"büyük","hold":"tutar","together":"birlikte"},"qs":[{"q":"What is the weather at first?","tr":"İlk başta hava nasıl?","options":["snowy","windy","sunny"],"answer":"windy"},{"q":"What does Deniz not have?","tr":"Deniz’in neyi yoktur?","options":["a kite","a hat","an umbrella"],"answer":"an umbrella"},{"q":"Who brings the umbrella?","tr":"Şemsiyeyi kim getirir?","options":["her father","her mother","her brother"],"answer":"her father"}]},
{"id":"b14","u":6,"lv":2,"t":"The Melting Snowman","e":"⛄","pages":[["❄️👧⛄","It is a snowy day. Lily makes a snowman.","Karlı bir gün. Lily bir kardan adam yapar."],["⛄🥕🎩","She gives him a red hat and a carrot nose.","Ona kırmızı bir şapka ve havuçtan bir burun verir."],["☀️🌡️","The next day, it is sunny and warm.","Ertesi gün hava güneşli ve sıcak."],["😱☀️💧","Oh no! The sun melts the snowman.","Eyvah! Güneş kardan adamı eritir."],["😢☁️❄️","Lily is sad. Then it is cloudy and snowy again.","Lily üzgün. Sonra hava yine bulutlu ve karlı olur."],["⛄🥕🥕","She makes a new snowman. Now the snowman has two carrot noses!","Yeni bir kardan adam yapar. Şimdi kardan adamın iki havuç burnu var!"]],"g":{"day":"gün","lily":"Lily (isim)","makes":"yapar","gives":"verir","carrot":"havuç","next":"sonraki, ertesi","sun":"güneş","melts":"eritir, erir","sad":"üzgün","then":"sonra","again":"yine","new":"yeni","noses":"burunlar"},"qs":[{"q":"What is the weather on the first day?","tr":"İlk gün hava nasıl?","options":["sunny","rainy","snowy"],"answer":"snowy"},{"q":"What melts the snowman?","tr":"Kardan adamı ne eritir?","options":["the wind","the rain","the sun"],"answer":"the sun"},{"q":"How many noses does the new snowman have?","tr":"Yeni kardan adamın kaç burnu var?","options":["one","two","three"],"answer":"two"}]},
{"id":"b15","u":7,"lv":3,"t":"The Funny Monster","e":"👾","pages":[["👧✏️👾","Ayşe draws a monster for her class. It has one big eye on its head.","Ayşe sınıfı için bir canavar çizer. Başında tek bir büyük göz var."],["👦❓👃","“Where is its nose?” asks Mert. “Oh, I forget!” says Ayşe.","“Burnu nerede?” diye sorar Mert. “Ah, unuttum!” der Ayşe."],["👧👃🍌","She draws a long nose. It looks like a banana!","Uzun bir burun çizer. Muza benziyor!"],["👾👂👄","The monster has three ears and one mouth. The mouth is very big.","Canavarın üç kulağı ve bir ağzı var. Ağız çok büyük."],["👾🦵","Now the monster needs legs. Ayşe draws six small legs.","Şimdi canavarın bacaklara ihtiyacı var. Ayşe altı küçük bacak çizer."],["👾🦶😂","But the legs have no feet. “It can’t walk!” laughs Mert.","Ama bacaklarda ayak yok. “Yürüyemez!” diye güler Mert."],["👾✋👋","Ayşe draws big feet and two hands. The monster waves hello.","Ayşe büyük ayaklar ve iki el çizer. Canavar merhaba diye el sallar."],["👏👩‍🏫","The class laughs and claps. “Best monster ever!” says the teacher.","Sınıf gülüp alkışlar. “Gelmiş geçmiş en iyi canavar!” der öğretmen."]],"g":{"ayşe":"Ayşe (isim)","mert":"Mert (isim)","draws":"çizer","monster":"canavar","monsters":"canavarlar","for":"için","class":"sınıf","big":"büyük","asks":"sorar","forget":"unutmak","says":"der","long":"uzun","looks":"görünür, benzer","banana":"muz","ears":"kulaklar","needs":"ihtiyacı var","legs":"bacaklar","six":"altı","small":"küçük","walk":"yürümek","laughs":"güler","hands":"eller","waves":"el sallar","hello":"merhaba","claps":"alkışlar","best":"en iyi","ever":"şimdiye kadar","now":"şimdi","its":"onun"},"qs":[{"q":"How many eyes does the monster have?","tr":"Canavarın kaç gözü var?","options":["two","one","three"],"answer":"one"},{"q":"What does the nose look like?","tr":"Burun neye benziyor?","options":["a banana","an apple","a pencil"],"answer":"a banana"},{"q":"How many legs does the monster have?","tr":"Canavarın kaç bacağı var?","options":["four","two","six"]," function evalWriting(i, text){
  const W = WRITE[i], L = LEVELS[i];
  const words = text.match(/[A-Za-z][A-Za-z'’]*/g) || [];
  const low = " " + text.toLowerCase().replace(/’/g,"'").replace(/\s+/g," ") + " ";
  const used = L.cards.filter(c=>new RegExp(`\\b${c.w}(s|es)?\\b`).test(low)).map(c=>c.w);
  const sents = text.split(/[.!?]+/).map(x=>x.trim()).filter(Boolean);
  const tidy = sents.length > 0 && sents.every(x=>/^[A-Z"“]/.test(x)) && /[.!?]["”]?\s*$/.test(text.trim());
  const pat = W.checks.map(c=>c.re.test(low));
  const n = words.length;
  const checks = [
    {ok:n>=WMIN, t:`En az ${WMIN} kelime yaz (${n}/${WMIN})`, p:"+20"},
    {ok:used.length>=3, t:`Bu ünitenin kelimelerinden en az 3 tane kullan (${used.length}/3)`, p:"kelime başı +2"},
    ...W.checks.map((c,k)=>({ok:pat[k], t:c.t, p:"+5"})),
    {ok:tidy, t:"Cümleler büyük harfle başlasın, nokta ile bitsin", p:"+5"},
    {ok:n>=WLONG, t:`Süper yazar: ${WLONG}+ kelime`, p:"+5"}
  ];
  const pts = n < WMIN ? 0 : 20 + Math.min(used.length*2, 10) + pat.filter(Boolean).length*5 + (tidy?5:0) + (n>=WLONG?5:0);
  return {n, used, checks, pts};
}

function normalize(s){
  s = s || {};
  if(!(s.p && s.p.easy && s.p.hard)){
    s = Array.isArray(s.done) ? {score:s.score||0, p:{easy:{unlocked:s.unlocked||0, done:s.done, finished:!!s.finished}, hard:fresh()}} : blankData();
  }
  for(const m of ["easy","hard"]){ const p = s.p[m]; while(p.done.length < LEVELS.length) p.done.push([]); }
  s.score = s.score||0; s.lessons = s.lessons||{}; s.days = s.days||[]; s.today = s.today||{d:"",pts:0};
  s.name = s.name||""; s.avatar = s.avatar||"🦊"; s.writings = s.writings||{}; s.sung = s.sung||{};
  s.towers = s.towers||{}; s.skills = s.skills||{}; for(const k of ["r","l","s"]) s.skills[k] = s.skills[k]||{};
  s.revN = s.revN||0;
  s.ad = Object.assign({s:0, r:[], m:0}, s.ad);
  s.place = s.place || null;
  s.books = s.books || {};
  s.exams = s.exams || {};
  s.chat = Object.assign({n:0}, s.chat);
  s.grade = MEB.some(x=>x.g === s.grade) ? s.grade : null;
  if(!s.rev){ s.rev = {}; LEVELS.forEach((L,i)=>{ if(s.lessons["c"+i]) L.cards.forEach(c=>{ s.rev[c.w] = {b:1, d:todayKey(), x:0}; }); }); }
  if(!s.badges){ s.badges = []; s.needBadgeInit = true; }
  return s;
}

const API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? "http://localhost:8787/api" : "https://ollie-akademi-api.ollieakademi.workers.dev/api";
const AKEY = "ollie-akademi-auth";
let auth = (()=>{ try{ const a = JSON.parse(localStorage.getItem(AKEY)); return a && a.token ? a : null; }catch(e){ return null; } })();
function saveAuth(){ try{ auth ? localStorage.setItem(AKEY, JSON.stringify(auth)) : localStorage.removeItem(AKEY); }catch(e){} }
async function api(path, opt={}){
  const headers = {"Content-Type":"application/json"};
  if(auth && auth.token) headers.Authorization = "Bearer " + auth.token;
  let res;
  try{ res = await fetch(API + path, {method: opt.method || (opt.body ? "POST" : "GET"), headers, body: opt.body ? JSON.stringify(opt.body) : undefined, keepalive: !!opt.keepalive}); }
  catch(e){ const err = new Error("İnternet bağlantısı yok gibi görünüyor. Bağlantını kontrol edip tekrar dene."); err.offline = true; throw err; }
  let data = {}; try{ data = await res.json(); }catch(e){}
  if((res.status === 401 || res.status === 403) && auth && path !== "/me/password" && path !== "/me/delete"){
    auth = null; saveAuth(); S = null; childId = null; play = null; go("login");
    setTimeout(()=>authMsg(esc(data.error || "Yeniden giriş yap.")), 50);
  }
  if(!res.ok){ const err = new Error(data.error || "Bir sorun oldu, tekrar dene."); err.status = res.status; throw err; }
  return data;
}
let S = null, childId = null, syncTimer = null, syncing = false;
const cacheKey = id => "ollie-akademi-child-" + id;
function readCache(id){ try{ return JSON.parse(localStorage.getItem(cacheKey(id))); }catch(e){ return null; } }
function writeCache(id, data, dirty){ try{ localStorage.setItem(cacheKey(id), JSON.stringify({data, dirty})); }catch(e){} }
function save(){
  if(!S || !childId) return;
  writeCache(childId, S, true);
  clearTimeout(syncTimer); syncTimer = setTimeout(sync, 1500);
}
async function sync(keepalive){
  clearTimeout(syncTimer);
  if(!childId || !auth) return;
  const id = childId, c = readCache(id);
  if(!c || !c.dirty) return;
  if(syncing && !keepalive){ syncTimer = setTimeout(sync, 1500); return; }
  syncing = true;
  try{
    await api("/children/" + id, {method:"PUT", body:{data:c.data, name:c.data.name || undefined, avatar:c.data.avatar}, keepalive});
    const cur = readCache(id); if(cur && JSON.stringify(cur.data) === JSON.stringify(c.data)) writeCache(id, c.data, false);
    const k = auth && auth.children.find(x=>x.id === id);
    if(k){ k.name = c.data.name || k.name; k.avatar = c.data.avatar; k.score = c.data.score; k.updated_at = Date.now(); saveAuth(); }
  }catch(e){ if(e.offline || e.status >= 500) syncTimer = setTimeout(sync, 15000); }
  finally{ syncing = false; }
}
addEventListener("pagehide", ()=>sync(true));
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "hidden") sync(true); });
addEventListener("online", ()=>sync());
async function enterChild(id){
  const c = readCache(id), info = auth.children.find(x=>x.id === id);
  let data;
  try{
    const r = await api("/children/" + id);
    data = c && c.dirty ? c.data : r.child.data;
    if(!(c && c.dirty)) writeCache(id, data, false);
  }catch(e){
    if(e.offline && c){ data = c.data; toast("Bağlantı yok. İlerlemen bu cihazda tutulacak, internet gelince kaydedilecek."); }
    else { toast(e.message); if(auth) go("profiles"); return; }

const dayKey = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayKey = () => dayKey(new Date());

const easyDone = i => S.p.easy.done[i].length >= 5;
const hardDone = i => S.p.hard.done[i].length >= 5;
const unitOpen = i => i === 0 || easyDone(i-1) || !!(S.place && i <= S.place.u);   // seviye testi başlangıç ünitesine kadar açar
const easyCount = () => LEVELS.filter((_,i)=>easyDone(i)).length;
const hardCount = () => LEVELS.filter((_,i)=>hardDone(i)).length;
const lessonCount = k => LEVELS.filter((_,i)=>S.lessons[k+i]).length;
const unitSteps = i => (S.lessons["s"+i]?1:0) + (S.lessons["c"+i]?1:0) + S.p.easy.done[i].length + S.p.hard.done[i].length;
const unitPct = i => Math.round(unitSteps(i)/12*100);
const lessonsDone = () => lessonCount("s") + lessonCount("c") + easyCount() + hardCount();
const title = () => LEVELS[Math.min(easyCount(), LEVELS.length-1)].rank;
function streak(){
  const set = new Set(S.days); const d = new Date(); let n = 0;
  if(!set.has(dayKey(d))) d.setDate(d.getDate()-1);
  while(set.has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function todayPts(){ return S.today.d === todayKey() ? S.today.pts : 0; }
function addPts(n){
  S.score += n;
  const t = todayKey();
  if(S.today.d !== t) S.today = {d:t, pts:0};
  S.today.pts += n;
  if(!S.days.includes(t)) S.days.push(t);
  S.days = S.days.slice(-90);
  save(); updateTop(true); checkBadges();
}
function nextStep(){
  const u0 = S.place ? S.place.u : 0;   // seviye testiyle başlanan üniteden ileri, sonra öncekiler
  for(const i of LEVELS.map((_,k)=>(k + u0) % LEVELS.length)){
    if(!S.lessons["s"+i]) return {i, kind:"song"};
    if(!S.lessons["c"+i]) return {i, kind:"cards"};
    if(!easyDone(i)) return {i, kind:"easy"};
    if(!(S.writings[i] && S.writings[i].best) && !S.lessons["s"+(i+1)]) return {i, kind:"write"};
  }
  for(let i=0;i<LEVELS.length;i++) if(!hardDone(i)) return {i, kind:"hard"};
  return null;
}

let voice = null;
function pickVoice(){ try{ const v = speechSynthesis.getVoices(); voice = v.find(x=>/en[-_]US/i.test(x.lang)) || v.find(x=>/^en/i.test(x.lang)) || null; }catch(e){} }
try{ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }catch(e){}
function speak(text, onend, rate){
  try{
    if(!("speechSynthesis" in window)) throw 0;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = rate || .82; u.pitch = 1.1; if(voice) u.voice = voice;
    if(onend){ u.onend = onend; u.onerror = onend; }
    speechSynthesis.speak(u);
  }catch(e){ say("Oops, no sound here.", "Bu cihazda ses çıkmıyor. Metni okuyabilirsin!"); onend && onend(); }
}

/* ---------- Router ---------- */
let page = "home", unitArg = 0, play = null;
function route(){
  stopSpeech(); stopRec(); chatStopRec(); play = null; sk = null; rv = null; bk = null; ex = null; ct = null;
  const h = location.hash.slice(1) || "home";
  const tk = h.match(/^(reset|verify)-([0-9a-f]{64})$/);
  const un = h.match(/^unsub-(\d+)-([0-9a-f]{32})$/);
  if(un){ history.replaceState(null, "", "#" + (S ? "home" : auth ? "profiles" : "login")); unsubscribe(un[1], un[2]); return route(); }
  if(tk){
    if(tk[1] === "verify"){ history.replaceState(null, "", "#" + (S ? "home" : auth ? "profiles" : "login")); verifyEmail(tk[2]); return route(); }
    resetToken = tk[2]; history.replaceState(null, "", "#reset");
    if(S){ sync(); S = null; childId = null; }
    page = "reset"; render(true); return;
  }
  const sh = h.match(/^sheet-(\d+)$/);
  if(sh && +sh[1]>=1 && +sh[1]<=LEVELS.length){ showSheet(+sh[1]-1); return; }
  hideSheet();
  if(h === "reset" && !S && resetToken){ page = "reset"; render(true); return; }
  if(!S){
    if(auth){ page = ["profiles","parent"].includes(h) ? h : "profiles"; if(page !== h) history.replaceState(null, "", "#"+page); }
    else page = ["register","forgot"].includes(h) ? h : "login";
    render(true); return;
  }
  if(["login","register","forgot","profiles","parent"].includes(h)){ history.replaceState(null, "", "#home"); }
  const ce = h.match(/^cert-(\w+)$/);
  if(ce && exPassed(ce[1])){ showCert(ce[1]); return; }
  const em = h.match(/^exam-(\w+)$/);
  const m = h.match(/^unit-(\d+)$/);
  const sm = h.match(/^(reading|listening|speaking)(?:-(\d+))?$/);
  if(m && +m[1]>=1 && +m[1]<=LEVELS.length){ page = "unit"; unitArg = +m[1]-1; }
  else if(sm){ page = sm[1]; if(sm[2] && +sm[2]>=1 && +sm[2]<=LEVELS.length) startSkill(sm[1], +sm[2]-1); }
  else if(h === "library") page = "library";
  else if(/^book-b\d+$/.test(h) && startBook(h.slice(5))) page = "book";
  else if(h === "review"){ page = "review"; startReview(); }
  else if(h === "placement"){ page = "placement"; pt = null; }
  else if(h === "exams") page = "exam";
  else if(/^chat(-\d+)?$/.test(h)){ page = "chat"; const n = +h.slice(5); if(n>=1 && n<=LEVELS.length) startChat(n-1); }
  else if(/^meb(-\d)?$/.test(h)){ page = "meb"; mebView = h.length > 3 ? +h.slice(4) : S.grade; if(!MEB.some(x=>x.g === mebView)) mebView = null; }
  else if(em && exStage(em[1]) && exOpen(exStage(em[1]))){ page = "exam"; startExam(em[1]); }
  else page = ["home","units","words","badges","profile"].includes(h) ? h : "home";
  render(true);
}
function render(greet){
  updateTop();
  const nav = play || page==="unit" || page==="placement" || page==="exam" || page==="meb" ? "units" : page==="review" ? "home" : page==="chat" ? "speaking" : page==="library" || page==="book" ? "reading" : page;
  document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on", a.dataset.nav===nav));
  const el = $("#screen");
  if(!S){ el.innerHTML = ({login:loginHTML, register:registerHTML, forgot:forgotHTML, reset:resetHTML, profiles:profilesHTML, parent:parentHTML})[page](); window.scrollTo({top:0}); if(greet) greetPage(); return; }
  if(play) el.innerHTML = play.kind==="song" ? songHTML() : play.kind==="cards" ? cardsHTML() : play.kind==="write" ? writeHTML() : play.kind==="tower" ? towerHTML() : quizHTML();
  else el.innerHTML = ({home:homeHTML, units:unitsHTML, unit:unitHTML, words:wordsHTML, badges:badgesHTML, profile:profileHTML,
    review:reviewHTML, chat:chatHTML, placement:placementHTML, exam:examHTML, meb:mebHTML, library:libraryHTML, book:bookHTML, reading:()=>sk ? readingHTML() : skillListHTML("reading"), listening:()=>sk ? listeningHTML() : skillListHTML("listening"), speaking:()=>sk ? speakingHTML() : skillListHTML("speaking")})[page]();
  if(play && play.order) renderOrder();
  if(!play && page==="words") renderWords();
  if(!play && page==="review" && rv && !rv.done && rv.queue[rv.pos].type==="ear") setTimeout(()=>speak(rv.queue[rv.pos].w), 300);
  window.scrollTo({top:0});
  if(!play && page==="chat") chatScroll();
  if(greet && !play) greetPage();
}
function greetPage(){

async function importLocal(k){
  if(busy) return; busy = true;
  try{
    const acc = k === "__legacy" ? null : store.accounts[k];
    const data = acc ? normalize(acc.data) : legacyData();
    if(!data) return;
    let name = (data.name || "").trim();
    if(!name){ name = prompt("Bu ilerleme hangi çocuğa ait? Adını yaz:") || ""; name = name.trim(); if(name.length < 2) return; data.name = name; }
    const r = await api("/children", {body:{name, avatar:data.avatar||"🦊", data}});
    if(acc) acc.migrated = r.child.id; else store.legacyMigrated = true;
    saveStore(); auth.children.push(r.child); saveAuth(); writeCache(r.child.id, r.child.data, false);
    toast(`${r.child.avatar} ${r.child.name} aktarıldı! ⭐ ${r.child.score}`); render();

function liveWrite(){
  const ta = $("#wt"); if(!ta) return;
  const r = evalWriting(play.unit, ta.value);
  $("#wc").textContent = `${r.n} kelime · ${r.n >= WMIN ? `şimdiki puan ⭐ ${r.pts}` : `${WMIN-r.n} kelime daha yaz`}`;
  $("#checks").innerHTML = r.checks.map(c=>`<li class="${c.ok?"ok":""}"><span class="m">${c.ok?"✅":"⬜"}</span><span>${c.t} <span class="tr">${c.p}</span></span></li>`).join("");
  return r;
}
function submitWrite(){
  const i = play.unit, text = $("#wt").value.trim(), r = liveWrite();
  if(r.n < WMIN){ say("Keep going! ✍️", `Biraz daha yaz! ${WMIN-r.n} kelime kaldı. Cümle başlangıçlarından yardım alabilirsin.`);
    $("#wfb").innerHTML = `<div class="fb try"><div class="en">Great start! Write ${WMIN-r.n} more words.</div><div class="tr">Puan almak için en az ${WMIN} kelime gerekiyor.</div></div>`; return; }
  const prev = (S.writings[i] && S.writings[i].best) || 0, gain = Math.max(0, r.pts - prev), first = !prev;
  S.writings[i] = {text, draft:text, best:Math.max(prev, r.pts), at:Date.now()};
  if(gain > 0) addPts(gain); else save();
  if(first){ confetti(); speak("Wonderful writing! You are a real writer!"); }
  const miss = r.checks.filter(c=>!c.ok);
  say(gain ? `Wonderful writing! ⭐ +${gain}` : "Nice work!", gain ? `Harika yazdın! ${gain} ek yıldız kazandın.` : "Bu puanı daha önce almıştın. Geliştirirsen ek yıldız gelir!");
  $("#wfb").innerHTML = `<div class="fb good"><div class="en">${gain ? `Wonderful writing! ⭐ +${gain}` : "Nice work! ⭐ +0"} <span class="tr">· Bu metnin puanı: ${r.pts}/50</span></div>
    ${r.used.length ? `<div>Kullandığın ünite kelimeleri: ${r.used.map(x=>`<span class="chip ok">${esc(x)}</span>`).join(" ")}</div>` : ""}
    ${miss.length ? `<div class="tr" style="margin-top:6px">Daha fazla yıldız için: ${miss.map(c=>c.t).join(" · ")}</div>` : `<div>Bütün maddeleri tamamladın, mükemmel! 🏆</div>`}</div>

}

/* ---------- Cümle Kulesi ---------- */
function startTower(i, k){
  const replay = (S.towers[i]||[]).includes(k);
  play = {kind:"tower", unit:i, tw:k, step:0, replay};
  startFloor(); render();
  say("Let's build a sentence tower! 🧱", "Her katta cümleye yeni bir parça ekleniyor. Renkli kartları doğru sıraya diz!");
}
function startFloor(){
  const n = TOWERS[play.unit][play.tw].steps[play.step].en.length, idx = [...Array(n).keys()];
  let cards; do{ cards = idx.slice().sort(()=>Math.random()-.5); }while(n>1 && cards.every((x,j)=>x===j));
  Object.assign(play, {cards, picked:[], tries:0, solved:false, msg:""});
}
const enText = st => st.en.map(x=>x[0]).join(" ") + ".";
const chunk = (c, role, attrs="", small) => `<${attrs?"button":"span"} class="chunk ${role}${small?" small":""}" ${attrs}>${esc(c)}</${attrs?"button":"span"}>`;
function towerHTML(){
  const i = play.unit, T = TOWERS[i][play.tw], st = T.steps[play.step], last = play.step === T.steps.length-1, done = S.towers[i]||[];
  const floors = T.steps.slice(0, play.step + (play.solved?1:0)).map((x,n)=>`<div class="floor"><span class="n">${n+1}</span>${x.en.map(c=>chunk(c[0],c[1],"",true)).join("")}</div>`).join("");
  const build = play.solved ? "" : `<div class="build" id="twBuild" aria-label="Senin cümlen">${play.picked.map(j=>chunk(st.en[j][0], st.en[j][1], `data-act="twPick" data-arg="${j}"`)).join("")}</div>
    <div class="bank">${play.cards.filter(j=>!play.picked.includes(j)).map(j=>chunk(st.en[j][0], st.en[j][1], `data-act="twPick" data-arg="${j}"`)).join("")}</div>
    <div class="row center"><button class="btn ghost small" data-act="twClear">↺ Clear</button><button class="btn" data-act="twCheck">Check ✓</button></div>`;
  const after = !play.solved ? "" : last
    ? `<div class="fb good"><div class="en">Tower complete! 🏆 “${esc(enText(st))}”</div><div class="tr">Şimdi bütün cümleyi Ollie ile birlikte yüksek sesle söyle!</div></div>
       <div class="row center"><button class="btn ghost" data-act="twSay">🔊 Listen</button><button class="btn ghost" data-act="twSlow">🐢 Slow</button>
       ${towersOf(i).length > 1 ? `<button class="btn" data-act="twGo" data-arg="${(play.tw+1)%towersOf(i).length}">Sıradaki kule ▶</button>` : ""}
       <a class="btn ${towersOf(i).length>1?"ghost":""}" href="#unit-${i+1}" data-act="twLeave">Ünite sayfası</a></div>`
    : `<div class="fb good"><div class="en">${play.msg}</div><div class="tr">“${esc(enText(st))}”</div></div>
       <div class="row center"><button class="btn ghost" data-act="twSay">🔊 Listen</button><button class="btn" data-act="twNext">Bir kat yukarı ⬆</button></div>`;
  return `${backBar()}<section class="panel">
    <div class="eyebrow">Ünite ${i+1} · Cümle Kulesi · Kule ${play.tw+1}/${towersOf(i).length} · Kat ${play.step+1}/${T.steps.length}${play.replay?" · Tekrar (⭐+1)":""}</div>
    <div class="row">${towersOf(i).map((x,n)=>`<button class="chip ${done.includes(n)?"ok":""}" type="button" data-act="twGo" data-arg="${n}" ${n===play.tw?'aria-current="true" style="border-color:var(--accent)"':""}>${done.includes(n)?"✓":x.e} ${esc(x.title)}</button>`).join("")}</div>
    <div class="legend">${Object.entries(ROLE).map(([r,o])=>`<span class="chunk small ${r}">${o.e} ${o.q}</span>`).join("")}</div>
    <div class="tower">${floors}</div>
    ${play.solved ? "" : `<div class="q">Build floor ${play.step+1}! <span class="tr">Bu katı İngilizce kur!</span></div>
    <div class="say trs">🇹🇷 ${st.tr.map(c=>chunk(c[0],c[1])).join("")}</div>
    ${play.step===1 ? `<div class="tr" style="text-align:center">İpucu: Türkçede 🟠 sonda durur, İngilizcede 🔵'nin hemen arkasına gelir!</div>` : ""}`}
    ${build}
    <div id="fb">${play.solved ? after : play.msg}</div>
  </section>`;
}
function twRefresh(){ $("#screen").innerHTML = towerHTML(); }
function twCheck(){
  if(play.solved) return;
  const st = TOWERS[play.unit][play.tw].steps[play.step];
  if(!play.picked.length){ say("Tap the cards first!","Önce renkli kartlara dokun!"); return; }
  if(play.picked.length < st.en.length){ say("Use all the cards!","Bütün kartları kullan!"); play.msg = `<div class="fb try"><div class="en">Use all the cards! 🧱</div><div class="tr">Aşağıda hâlâ kart var. Hepsini cümleye ekle.</div></div>`; return twRefresh(); }
  const bad = play.picked.findIndex((j,n)=>j!==n);
  if(bad < 0){
    play.solved = true;
    const fresh = !play.replay, pts = fresh ? (play.tries===0 ? 3 : 2) : 1;
    addPts(pts);
    const p = PRAISE[Math.floor(Math.random()*PRAISE.length)];
    play.msg = `${p[0]} ⭐ +${pts}`;
    const T = TOWERS[play.unit][play.tw];
    if(play.step === T.steps.length-1) return finishTower();
    say(`${p[0]} ⭐ +${pts}`, `${p[1]} Kat tamam, bir kat daha yukarı!`);
    speak(enText(st)); twRefresh(); return;
  }
  play.tries++;
  const r = ROLE[st.en[bad][1]];
  say("Great try! Look at the colors.", "Güzel deneme! Renklere bak.");
  play.msg = `<div class="fb try"><div class="en">Almost! Look at the colors. 🤔</div><div class="tr">${bad+1}. sıraya ${r.e} <b>${r.q}</b> kartı gelir.${st.en[bad][1]==="does" && bad>0 ? " İngilizcede 🟠, 🔵'nin hemen arkasında durur." : ""}</div></div>`;
  twRefresh();
}
function finishTower(){
  const i = play.unit, d = S.towers[i] = S.towers[i]||[], first = !d.includes(play.tw);
  if(first){ d.push(play.tw); addPts(5); }
  if(towersDone(i) >= towersOf(i).length && !S.lessons["k"+i]){ S.lessons["k"+i] = true; save(); toast("🧱 Cümle Kulesi dersi tamam!"); }
  confetti();
  const st = TOWERS[i][play.tw].steps.slice(-1)[0];
  say(first ? "Tower complete! ⭐ +5 bonus!" : "Tower complete!", first ? "Kuleyi bitirdin! 5 bonus yıldız kazandın. Şimdi bütün cümleyi yüksek sesle söyle." : "Kuleyi yine bitirdin! Cümleyi yüksek sesle söyle.");
  speak(enText(st)); twRefresh();
}

const tasksOf = () => LEVELS[play.unit][play.mode==="hard"?"hard":"tasks"];
const blankLine = (L,t) => L.song.lines[t.line].replace(new RegExp(`(<b>)?\\b${t.blank}\\b(</b>)?`,"i"), '<span class="blank">?</span>');
const formHTML = () => `<form class="row center" id="wform"><input class="write" id="w-${play.mode}-${play.unit}-${play.task}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type here…" aria-label="Cevabın"><button class="btn" type="submit">Check ✓</button></form>`;

/* ---------- Uyarlanabilir zorluk ----------
   S.ad = {s: üst üste ilk denemede doğru sayısı, r: son 10 sonuç (1 = ilk denemede doğru), m: en uzun seri}.
   Üst üste AD_HOT doğru yapan çocuğa seçmeli soru "⚡ Meydan okuma" olarak gelir: seçenek yok, cevabı yazar, ilk denemede ⭐ ek.
   Son 6 sorunun en az 3'ünde zorlanan çocuğa baştan 💡 ipucu düğmesi çıkar (zor testte ipucu da ilk yanlışta gelir).
   Aynı soruda yanlış arttıkça Ollie adım adım yardım eder: yanlış seçenekleri kaldırır, harfleri açar, cümlenin ilk kelimelerini yerleştirir. */
const AD_HOT = 3, CH_BONUS = 5, OPT_TYPES = ["pick","listen","song","story"];
function adRec(ok){ const a = S.ad; a.s = ok ? a.s + 1 : 0; a.m = Math.max(a.m, a.s); a.r = a.r.concat(ok ? 1 : 0).slice(-10); }
const adHot = () => S.ad.s >= AD_HOT;
const adWeak = () => { const r = S.ad.r.slice(-6); return r.length >= 4 && r.filter(x=>!x).length >= 3; };
const adCounts = t => !["speak","speakTr"].includes(t.type);   // "I said it!" soruları seriyi etkilemez
const chEmo = t => t.type==="pick" && !/riddle/i.test(t.q) ? (t.options||[]).find(o=>typeof o!=="string" && o.v===t.answer && o.e) : null;
function chAns(t){ // meydan okumada yazılacak tek kelime; uygun değilse null
  if(!OPT_TYPES.includes(t.type)) return null;
  const a = t.type==="song" ? t.blank : t.answer;
  if(typeof a !== "string") return null;
  const w = a.toLowerCase().replace(/^(the|a|an|my) /,"");
  if(!/^[a-z]{2,12}$/.test(w)) return null;
  if(t.type==="pick" && !/riddle/i.test(t.q) && !(chEmo(t) && new RegExp(`\\b${w}\\b`,"i").test(t.q))) return null;
  return w;
}
function helpHTML(t){
  const lv = play.tries - (play.mode==="hard" && !play.weak ? 2 : 1);
  if(lv < 1 || play.ch) return "";
  if(OPT_TYPES.includes(t.type)){
    const ans = t.type==="song" ? t.blank : t.answer;
    const rest = [...document.querySelectorAll("#screen .opt")].filter(b=>b.dataset.v!==ans && !b.classList.contains("gone"));
    if(rest.length <= 1) return "";
    rest.sort(()=>Math.random()-.5).slice(0, rest.length-1).forEach(b=>{ b.classList.add("gone"); b.disabled = true; play.elim.add(b.dataset.v); });
    return `<div class="help">🦉 Ollie yardım etti: yanlış seçeneklerin bazılarını kaldırdım. Kalan ikisinden biri doğru!</div>`;
  }
  if(["write","songtype","dictation"].includes(t.type)){
    const a = t.type==="songtype" ? t.blank : t.type==="dictation" ? t.word : t.answer;
    const n = Math.min(lv + (t.type==="write" ? 1 : 0), a.length - 1);
    const m = [...a].map((ch,k)=> ch===" " ? " " : k < n ? ch : "_").join(" ");
    return `<div class="help">🦉 Ollie yardım ediyor: <span class="helpmask">${esc(m)}</span> <span class="tr">(${a.replace(/ /g,"").length} harf)</span></div>`;
  }
  if(t.type==="order"){

/* ---------- Akıllı tekrar (Bugünün tekrarı) ----------
   S.rev[kelime] = {b: kutu 0–5, d: tekrar günü "YYYY-AA-GG", x: yanlış sayısı}.
   Doğru cevapta kutu bir artar ve kelime REV_GAP[kutu] gün sonra yeniden gelir; yanlışta kutu 0'a düşer, yarın yine sorulur. */
const REV_GAP = [1,1,3,7,14,30], REV_SIZE = 8;
const WORDS = {}; LEVELS.forEach((L,i)=>L.cards.forEach(c=>{ WORDS[c.w] = {i, c}; }));
const addDays = n => { const d = new Date(); d.setDate(d.getDate()+n); return dayKey(d); };
const revDue = () => Object.keys(S.rev).filter(w=>WORDS[w] && S.rev[w].d <= todayKey());
const revRank = (a,b) => S.rev[b].x - S.rev[a].x || S.rev[a].b - S.rev[b].b || (S.rev[a].d < S.rev[b].d ? -1 : 1);
let rv = null;
function revAddUnit(i){ LEVELS[i].cards.forEach(c=>{ if(!S.rev[c.w]) S.rev[c.w] = {b:0, d:addDays(1), x:0}; }); }
function revMiss(i, t){
  const ws = new Set();
  [t.answer, t.word, t.blank].forEach(a=>{ if(typeof a==="string" && WORDS[norm(a)]) ws.add(norm(a)); });
  if(!ws.size && typeof (t.answer||t.sentence) === "string"){ const txt = " " + norm(t.answer||t.sentence) + " ";
    LEVELS[i].cards.forEach(c=>{ if(new RegExp(` ${c.w}(s|es)? `).test(txt)) ws.add(c.w); }); }
  ws.forEach(w=>{ const r = S.rev[w] || {b:0, d:"", x:0}; S.rev[w] = {b:0, d:todayKey(), x:r.x+1}; });
  if(ws.size) save();
}
/* Yanlış cevabı açıklama: çocuğun verdiği cevaba bakıp NEDEN olmadığını kısa bir Türkçe notla söyler.
   Doğru cevabı ele vermez; seçilen kelimenin anlamını, yazımdaki hatanın türünü ya da cümledeki sıra hatasını anlatır. */
const EXTRA_TR = {walk:"yürümek", talk:"konuşmak", bed:"yatak", sun:"güneş", grass:"çimen", frog:"kurbağa", flower:"çiçek", cat:"kedi",
  goodbye:"hoşça kal", hello:"merhaba", meow:"miyav", eat:"yemek yemek", brush:"fırçalamak", school:"okul", breakfast:"kahvaltı",
  eggs:"yumurtalar", kite:"uçurtma", eyes:"gözler", legs:"bacaklar", two:"iki", three:"üç", four:"dört", me:"ben", jump:"zıplamak",
  white:"beyaz", fingers:"parmaklar", has:"sahip olmak (he/she/it)", have:"sahip olmak (I/you/we/they)", is:"-dir (he/she/it)", are:"-dir (we/you/they)", am:"-im (I)",
  "both of them":"ikisi de", "red and yellow":"kırmızı ve sarı", "on the desk":"sıranın üstünde", "in my bag":"çantamın içinde",
  "under the book":"kitabın altında", "at seven":"saat yedide", "at seven thirty":"saat yedi buçukta", "at eight":"saat sekizde",
  "my brother":"erkek kardeşim", "my sister":"kız kardeşim"};
const trOf = v => { const w = norm(v), b = w.replace(/^(a|an|the|my) /, "");
  if(EXTRA_TR[w]) return EXTRA_TR[w];
  const c = (WORDS[w] || WORDS[b] || WORDS[b.replace(/e?s$/,"")] || {}).c;
  return c ? c.tr.toLocaleLowerCase("tr-TR") : EXTRA_TR[b] || ""; };
const GRAM = {"have>has":"He / She / It (o) ile HAS kullanılır, HAVE değil.", "has>have":"I / You / We / They ile HAVE kullanılır, HAS değil.",
  "are>is":"Tek bir şey için IS kullanılır, ARE değil.", "is>are":"Birden fazla şey için ARE kullanılır, IS değil.",
  "is>am":"I (ben) ile AM kullanılır.", "am>is":"He / She / It ile IS kullanılır.", "do>does":"He / She / It ile DOES kullanılır.", "does>do":"I / You / We / They ile DO kullanılır.",
  "a>an":"Sesli harfle başlayan kelimeden önce AN gelir (an apple).", "an>a":"Sessiz harfle başlayan kelimeden önce A gelir (a cat)."};
function editInfo(a, b){ // a: çocuğun yazdığı, b: doğru cevap
  if(a.length === b.length){
    const d = [...a].map((x,n)=>x!==b[n]?n:-1).filter(n=>n>=0);
    if(d.length===2 && d[1]===d[0]+1 && a[d[0]]===b[d[1]] && a[d[1]]===b[d[0]]) return "İki harfin yeri karışmış. Harflerin sırasına dikkat et!";
    if(d.length===1) return `Çok yaklaştın! Sadece ${d[0]+1}. harf yanlış.`;
    if(d.length===2) return "Çok yaklaştın! Sadece iki harf farklı.";
    return "";
  }
  const [s, l] = a.length < b.length ? [a, b] : [b, a];
  if(l.length - s.length !== 1) return "";
  for(let n=0; n<l.length; n++) if(l.slice(0,n)+l.slice(n+1) === s){
    if(a.length < b.length) return /(.)\1/.test(b) && !/(.)\1/.test(a) ? "Bir harf eksik. İpucu: bu kelimede yan yana iki aynı harf var!" : "Çok yaklaştın! Bir harf eksik.";
    return "Çok yaklaştın! Bir harf fazla.";
  }
  return "";
}
function whyTyped(given, ans){
  const g = norm(given), a = norm(ans); if(!g || g === a) return "";
  if(/[şçğıöü]/.test(g)){
    return trOf(a) && g === trOf(a) ? "Bu kelimenin Türkçesini yazdın, aferin! Şimdi İngilizcesini yaz." : "İngilizcede ş, ç, ğ, ı, ö, ü harfleri yok. İngilizce harflerle yaz.";
  }
  if(GRAM[g+">"+a]) return GRAM[g+">"+a];
  if(g === a+"s" || g === a+"es") return "Sonuna fazladan -s koymuşsun. Burada tek bir şey var.";
  if(a === g+"s" || a === g+"es") return "Sonundaki -s eksik. Birden fazla şey varsa kelimenin sonuna -s gelir.";
  const e = editInfo(g, a); if(e) return e;
  const m = trOf(g); if(m) return `<b>${esc(g)}</b> = ${esc(m)} demek. Burada başka bir kelime lazım.`;
  if(trOf(a) && g === norm(trOf(a))) return "Bu kelimenin Türkçesini yazdın, aferin! Şimdi İngilizcesini yaz.";
  return "";
}
function whyOrder(t, words){
  const A = norm(t.answer).split(" "), G = words.map(norm), x = norm(t.extra||"");
  if(x && G.includes(x) && !A.includes(x)) return `<b>${esc(t.extra)}</b> kelimesi bu cümlede fazla. Onu kullanma! 🕵️`;
  if(G.length < A.length) return `Cümle eksik: ${A.length - G.length} kelime daha eklemen gerekiyor.`;
  const k = G.findIndex((w,n)=>w!==A[n]);
  return k > 0 ? `İlk ${k} kelime doğru 👍, sonrası karışmış.` : "Kelimeler doğru ama sıra karışmış. İngilizcede cümle önce KİM ile başlar, sonra NE YAPIYOR gelir.";
}
function whyOpt(t, v){
  const o = (t.options||[]).find(o=>(typeof o==="string" ? o : o.v) === v), e = o && o.e ? o.e + " " : "", m = trOf(v);
  const what = `Seçtiğin ${e}<b>${esc(v)}</b>${m ? " = " + esc(m) : ""}.`;
  if(t.type==="song") return `${what} Bu kelime şarkının bu satırına uymuyor.`;
  if(t.type==="pick") return `${what} Ama soru başka birini soruyor.`;
  return `${what} Ollie'nin anlattığıyla uyuşmuyor, dikkatlice dinle.`;
}
function whyWrong(t, given){
  if(given == null) return "";
  if(t.type==="order") return whyOrder(t, given);
  if(t.options) return whyOpt(t, given);
  return whyTyped(given, t.type==="songtype" ? t.blank : t.type==="dictation" ? t.word : t.answer);
}
const whyHTML = s => s ? `<div class="why">🦉 <b>Neden olmadı?</b> ${s}</div>` : "";

function startReview(){

  rv = {free, queue:list.map(w=>({w, again:false})), pos:0, first:0, total:list.length, pts:0, again:new Set(), done:false};

function revQuestion(){
  const q = rv.queue[rv.pos], {i, c} = WORDS[q.w], r = S.rev[q.w];
  const tr = r.b >= 2 || (r.b >= 1 && adHot()), types = tr ? ["pic","ear","tr"] : ["pic","ear"];   // seri yapan çocuğa yazma sorusu daha erken gelir
  q.type = q.again ? "tr" : types[(rv.pos + r.b) % types.length];
  if(q.type === "tr" && !tr && !q.again) q.type = "pic";
  if(q.type !== "tr"){
    let pool = LEVELS[i].cards.filter(x=>x.w!==c.w);
    if(pool.length < 3) pool = pool.concat(Object.values(WORDS).map(x=>x.c).filter(x=>x.w!==c.w && !pool.includes(x)));
    q.opts = pool.sort(()=>Math.random()-.5).slice(0,3).concat(c).sort(()=>Math.random()-.5);
  }
  q.solved = false; q.tries = 0;
}

  else body = `<div class="q">Write it in English! <span class="tr">İngilizcesini yaz.</span></div>

function revShow(){ $("#screen").innerHTML = reviewHTML(); const q = rv.queue[rv.pos];
  if(!rv.done && q.type==="ear") setTimeout(()=>speak(q.w), 300);
  const inp = $("#rvIn"); if(inp) setTimeout(()=>inp.focus(), 50); }
function revAnswer(v, btn){
  const q = rv.queue[rv.pos]; if(q.solved) return;
  const {c} = WORDS[q.w], r = S.rev[q.w];
  if(norm(v) === norm(c.w)){
    q.solved = true;
    if(btn) btn.classList.add("right");
    let pts = 0, note;
    if(q.again){ pts = 1; note = "Bu sefer bildin! Yarın yine soracağım."; }
    else if(q.tries===0){ pts = 2; rv.first++; adRec(1);
      if(!rv.free){ r.b = Math.min(r.b+1, 5); r.d = addDays(REV_GAP[r.b]); note = `${REV_GAP[r.b]} gün sonra yeniden soracağım.`; }
      else note = "Harika, bu kelimeyi hatırlıyorsun!"; }
    else { pts = 1; note = "Yarın bir kez daha soracağım."; }
    rv.pts += pts; addPts(pts);
    const p = PRAISE[Math.floor(Math.random()*PRAISE.length)];
    say(`${p[0]} ⭐ +${pts}`, note);
    speak(c.w);
    $("#fb").innerHTML = `<div class="fb good"><div class="en">${p[0]} ⭐ +${pts}</div><div>${c.e} <b>${esc(c.w)}</b> · ${esc(c.tr)}</div><div class="tr">“${esc(c.ex)}”</div></div>
      <div class="row center" style="margin-top:12px"><button class="btn" data-act="rvNext">${rv.pos+1 >= rv.queue.length ? "🏁 Bitir" : "Sonraki ▶"}</button></div>`;
    $('[data-act="rvNext"]').focus();
    return;
  }
  if(btn){ btn.classList.add("wrong"); setTimeout(()=>btn.classList.remove("wrong"), 600); }
  q.tries++;
  if(q.tries===1 && !q.again){
    r.b = 0; r.d = addDays(1); r.x++; rv.again.add(q.w); adRec(0); save();
    rv.queue.push({w:q.w, again:true});
  }
  if(q.tries===1){ say("Almost! Try again.", `İpucu: “${c.w[0]}” harfiyle başlıyor, ${c.w.replace(/ /g,"").length} harf.`);
    $("#fb").innerHTML = `<div class="fb try"><div class="en">Almost! 🤔</div><div class="tr">İpucu: <b>${esc(c.w[0].toUpperCase())}</b> ile başlıyor, ${c.w.replace(/ /g,"").length} harf. Bu kelimeyi sonra bir kez daha soracağım.</div>${whyHTML(btn ? (trOf(v) ? `Seçtiğin <b>${esc(v)}</b> = ${esc(trOf(v))}.` : "") : whyTyped(v, c.w))}</div>`;
    return; }
  q.solved = true;
  say("That's OK!", "Sorun değil, doğru cevap bu. Birazdan yine soracağım.");
  speak(c.w);
  document.querySelectorAll(".rvopt").forEach(x=>{ if(x.dataset.arg===c.w) x.classList.add("right"); });
  $("#fb").innerHTML = `<div class="fb try"><div class="en">${c.e} <b>${esc(c.w)}</b> · ${esc(c.tr)}</div><div class="tr">“${esc(c.ex)}”</div></div>
    <div class="row center" style="margin-top:12px"><button class="btn" data-act="rvNext">${rv.pos+1 >= rv.queue.length ? "🏁 Bitir" : "Sonraki ▶"}</button></div>`;
}
function revNext(){
  stopSpeech();
  if(rv.pos+1 < rv.queue.length){ rv.pos++; revQuestion(); revShow(); window.scrollTo({top:0}); return; }
  rv.done = true;
  if(!rv.free){ S.revN++; const bonus = rv.first===rv.total ? 5 : 3; rv.pts += bonus; addPts(bonus); }

}

/* ---------- Seviye tespit testi ----------
   Ünite 1'den başlayarak her üniteden 2 soru sorulur: kelime (resme bak-kelimeyi seç ya da dinle-resmi seç) ve ünitenin kolay testinden
   bir anlama sorusu (bilmece/dinleme). 2/2 → sonraki üniteye geçilir; 1/2 → bir kelime sorusu daha, 2/3 ise geçilir; değilse test biter.
   Sonuç S.place = {u: başlangıç ünitesi, d: tarih, r: doğru, n: soru}. 0..u ünitelerinin hepsi açılır (unitOpen), "Kaldığın yerden devam"
   u'dan başlar. Geçilen ünitelerin kelimeleri birkaç gün sonra Bugünün tekrarı'na gelir. Testte doğru/yanlış gösterilmez (çocuk üzülmesin). */
let pt = null;
const den = n => n + (n % 10 ? {3:"'ten",4:"'ten",5:"'ten",6:"'dan",9:"'dan"}[n % 10] || "'den" : {1:"'dan",2:"'den",3:"'dan",4:"'tan"}[n / 10] || "'den");   // Türkçe ayrılma eki: 4'ten, 6'dan, 10'dan, 20'den
function ptVocab(u, type, not){
  const cards = LEVELS[u].cards.filter(c=>c.w !== not), c = cards[Math.floor(Math.random()*cards.length)];
  const opts = LEVELS[u].cards.filter(x=>x.w!==c.w).sort(()=>Math.random()-.5).slice(0,2).concat(c).sort(()=>Math.random()-.5);
  return {type, w:c.w, e:c.e, answer:c.w, opts:opts.map(o=>({v:o.w, e:o.e}))};
}
function ptUnit(u){
  const tk = LEVELS[u].tasks.filter(t=>t.type==="pick" || t.type==="listen"), t = tk[(u + (Math.random() < .5 ? 0 : 1)) % tk.length];
  const v = ptVocab(u, Math.random() < .5 ? "pic" : "ear");
  return [v, {type:t.type, q:t.q, tr:t.tr, say:t.say, answer:t.answer, opts:t.options.map(o=>typeof o==="string" ? {v:o} : o)}];
}
function startPlace(){ pt = {u:0, qs:ptUnit(0), k:0, ok:0, n:0, right:0, marks:[], done:false, busy:false}; }
function placeCardHTML(){
  if(S.place || S.lessons.s0 || S.score > 0) return "";
  return `<div class="continue"><span class="ic">🎯</span><div class="txt"><div class="eyebrow">Yeni misin?</div><h3>İngilizceyi biraz biliyor musun?</h3>
    <span class="tr">3–5 dakikalık seviye testini çöz, Ollie seni sana uygun üniteden başlatsın.</span></div>
    <div class="row"><a class="btn" href="#placement">Seviye testi ▶</a><button class="btn ghost small" data-act="placeSkip">Baştan başlayacağım</button></div></div>`;
}
function placementHTML(){

  if(!pt) return `${top}<section class="panel" style="text-align:center">
    <div style="font-size:3.5rem">🎯</div><h1>Seviye testi</h1>

    ${S.place && !S.place.skip ? `<p class="tr">Son sonucun: <b>Ünite ${S.place.u+1}</b>. Testi yeniden çözersen açık üniteler kapanmaz.</p>` : ""}

      <div style="font-size:3.5rem">${u ? "🚀" : "🌱"}</div>
      <h1>${all ? "Harikasın! Bütün ünitelerin sorularını bildin!" : u ? `Ünite ${den(u+1)} başlayabilirsin!` : "Ünite 1'den başlamak en iyisi!"}</h1>
      <p><b>${pt.n}</b> sorudan <b>${pt.right}</b> tanesini bildin.${pt.pts ? ` ⭐ +${pt.pts}` : ""}</p>
      ${u ? `<p class="tr">Ünite 1–${u+1} senin için açıldı. Geçtiğin ünitelerin kelimelerini Ollie birkaç gün sonra 🔁 Bugünün tekrarı'nda soracak. İstersen o ünitelere de dönebilirsin.</p>
        <div class="row center" style="flex-wrap:wrap">${LEVELS.slice(0,u).map((x,i)=>`<span class="chip ok">✓ ${x.icon} ${x.theme}</span>`).join(" ")}</div>`
        : `<p class="tr">Şarkıyla ve kelime kartlarıyla başlayacağız. Her şey adım adım! 🦉</p>`}
      ${all ? `<p class="tr">Son ünitenin derslerinden sonra 🦅 Zor testleri dene!</p>` : ""}
      ${S.place.u > u ? `<p class="tr">Daha önce açılan Ünite 1–${S.place.u+1} açık kalıyor. Zorlandığın yerleri tekrar etmek iyi gelir!</p>` : ""}
      <div class="row center"><a class="btn" href="#unit-${u+1}">${L.icon} Ünite ${u+1}: ${L.theme} ▶</a><a class="btn ghost" href="#home">Ana sayfa</a></div></section>`;
  }
  const q = pt.qs[pt.k], L = LEVELS[pt.u];

  else body = (q.type==="listen" ? `<div class="row center"><button class="btn" data-act="ptPlay">🔊 Listen to Ollie</button><button class="btn ghost small" data-act="ptSlow">🐢 Slow</button></div>` : "")
    + `<div class="q">${esc(q.q)} <span class="tr">${esc(q.tr)}</span></div>`;
  const opts = q.opts.map(o=> q.type==="pic" ? `<button class="opt" data-act="ptAns" data-arg="${esc(o.v)}">${esc(o.v)}</button>`
    : `<button class="opt" data-act="ptAns" data-arg="${esc(o.v)}" aria-label="${esc(o.v)}">${o.c ? `<span class="sw" style="background:${o.c}"></span>` : o.e ? `<span class="emo">${o.e}</span>` : esc(o.v)}</button>`).join("");
  return `${top}<section class="panel">

function ptShow(){ $("#screen").innerHTML = placementHTML(); window.scrollTo({top:0});
  const q = pt && !pt.done && pt.qs[pt.k]; if(q && (q.type==="ear" || q.type==="listen")) setTimeout(()=>speak(q.type==="ear" ? q.w : q.say), 300); }
function ptAnswer(v, btn){
  if(!pt || pt.done || pt.busy) return;
  const q = pt.qs[pt.k], ok = v === q.answer;
  pt.n++; if(ok){ pt.ok++; pt.right++; }
  if(btn && v) btn.classList.add("pick");
  pt.busy = true; stopSpeech();
  setTimeout(()=>{ pt.busy = false; ptStep(); }, v ? 450 : 150);
}
function ptStep(){
  pt.k++;
  const asked = pt.k, ok = pt.ok;
  if(asked === 2 && ok === 1){ pt.qs.push(ptVocab(pt.u, pt.qs[0].type==="pic" ? "ear" : "pic", pt.qs[0].w)); return ptShow(); }
  if(asked < pt.qs.length) return ptShow();
  const pass = ok >= 2;
  pt.marks[pt.u] = pass ? "ok" : "no";
  if(pass && pt.u + 1 < LEVELS.length){ pt.u++; pt.qs = ptUnit(pt.u); pt.k = 0; pt.ok = 0; say("Great! Next unit.", `Ünite ${pt.u+1}: ${LEVELS[pt.u].theme} soruları geliyor.`); return ptShow(); }
  finishPlace(pass ? LEVELS.length - 1 : pt.u, pass);
}
function finishPlace(u, all){
  const first = !S.place || S.place.skip, prev = S.place && !S.place.skip ? S.place.u : 0;
  pt.done = true; pt.res = u; pt.all = all; pt.pts = first ? 10 : 0;
  S.place = {u: Math.max(prev, u), d: todayKey(), r: pt.right, n: pt.n};
  for(let i = 0; i < u; i++) LEVELS[i].cards.forEach(c=>{ if(!S.rev[c.w]) S.rev[c.w] = {b:2, d:addDays(3 + i % 4), x:0}; });
  if(pt.pts) addPts(pt.pts); else save();
  confetti(); speak(u ? "Well done! Let's go!" : "Let's start together!");
  say(u ? "Level found! 🎯" : "Let's start! 🌱", u ? `Ünite ${u+1}: ${LEVELS[u].theme} senin için en uygun yer.` : "Ünite 1'den, şarkılarla başlayalım.");
  ptShow();
}

/* ---------- Deneme sınavları + seviye sertifikası ----------
   Her seviyenin (STAGES) kendi deneme sınavı var. Cambridge sınavlarına benzer üç bölüm: 👂 Listening, 📖 Reading, ✍️ Writing.
   Sorular o seviyenin ünitelerinden rastgele seçilir; ipucu yok, her soru tek deneme, cevaplar sonda gösterilir.
   Her bölüm 1–5 kalkan (🛡️) alır. Toplam %60 ve üstü → seviye sertifikası (yazdırılabilir) + rozet.
   Veri: S.exams[seviye] = {b: en iyi %, sec: en iyi denemenin bölüm yüzdeleri, d: en iyi denemenin günü, n: deneme sayısı, p: ilk geçiş günü, sd: yıldız verilen son gün}. */
const EX_PASS = 60, EX_FIRST = 20;
const EX_SEC = {l:{e:"👂", n:"Listening", tr:"Dinleme"}, r:{e:"📖", n:"Reading", tr:"Okuma"}, w:{e:"✍️", n:"Writing", tr:"Yazma"}};

function buildExam(g){

  for(let k = 0; k < 3; k++){ const i = pick(k), it = LISTENING[i][Math.floor(Math.random() * LISTENING[i].length)];
    qs.push({s:"l", u:i, type:"listen", say:it.say, q:it.q, tr:it.tr, answer:it.answer, opts:exShuf(exOpts(it.options))}); }

    if(t) qs.push({s:"l", u:i, type:"listen", say:t.say, q:t.q, tr:t.tr, answer:t.answer, opts:exShuf(exOpts(t.options))});
    else { const v = ptVocab(i, "ear"); qs.push({s:"l", u:i, type:"ear", say:v.w, answer:v.answer, opts:v.opts}); } }

  const ri = pick(9), R = READING[ri];

  // ✍️ Writing: 3 boşluk doldurma + 2 yazım (dinle, yaz) + (Flyers ve sonrası) kısa yazı
  for(let k = 0; k < 3; k++){ const i = pick(k + 10), w = tasksOfType(i, "write"); if(!w.length) continue; const t = w[Math.floor(Math.random() * w.length)];
    qs.push({s:"w", u:i, type:"gap", e:t.e, sentence:t.sentence, tr:t.tr, answer:t.answer, alts:t.alts || []}); }
  for(let k = 0; k < 2; k++){ const i = pick(k + 13), d = tasksOfType(i, "dictation"), t = d.length ? d[Math.floor(Math.random() * d.length)] : null,
      c = t ? {w:t.word, e:t.e} : LEVELS[i].cards[Math.floor(Math.random() * LEVELS[i].cards.length)];

function startExam(id){

const exWeight = q => q.w || 1;
function exScore(){
  const sec = {};
  for(const s of ["l","r","w"]){ const qs = ex.qs.map((q,k)=>({q, a:ex.ans[k]})).filter(x => x.q.s === s);
    const max = qs.reduce((a,x)=>a + exWeight(x.q), 0), got = qs.reduce((a,x)=>a + (x.a ? x.a.pts : 0), 0);
    sec[s] = {got:Math.round(got*10)/10, max, p:max ? Math.round(got / max * 100) : 0}; }
  const max = Object.values(sec).reduce((a,x)=>a + x.max, 0), got = Object.values(sec).reduce((a,x)=>a + x.got, 0);
  return {sec, p:Math.round(got / max * 100), right:ex.ans.filter(a => a && a.ok).length};
}

function exEssayDone(){

/* ---------- Reading · Listening · Speaking bölümleri ---------- */
const SKILL = {
  reading:{e:"📕", n:"Reading", tr:"Okuma", key:"r", unitName:"hikâye", total:i=>READING[i].qs.length},
  listening:{e:"🎧", n:"Listening", tr:"Dinleme", key:"l", unitName:"dinleme", total:i=>LISTENING[i].length},
  speaking:{e:"🗣️", n:"Speaking", tr:"Konuşma", key:"s", unitName:"cümle", total:i=>SPEAKING[i].length}
};
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const skDone = (type,i) => S.skills[SKILL[type].key][i] || [];
const skComplete = (type,i) => skDone(type,i).length >= SKILL[type].total(i);
const skCount = type => LEVELS.filter((_,i)=>skComplete(type,i)).length;
let sk = null, rec = null;
function stopRec(){ if(rec){ const r = rec; rec = null; try{ r.abort(); }catch(e){} } }
function startSkill(type, i){
  const done = skDone(type, i), full = skComplete(type, i);
  sk = {type, unit:i, local:new Set(full ? [] : done), tries:{}, answered:{}, solved:false, showTr:false, idx:0};
  if(type !== "reading") sk.idx = Math.max(0, [...Array(SKILL[type].total(i)).keys()].find(n=>!sk.local.has(n)) ?? 0);
}
function skAward(type, i, n, pts){
  const k = SKILL[type].key, d = S.skills[k][i] = S.skills[k][i] || [];
  const was = skComplete(type, i);
  if(d.includes(n)) pts = 1; else d.push(n);
  addPts(pts);
  let bonus = 0;
  if(!was && skComplete(type, i)){ bonus = 5; addPts(5); confetti(); toast(`${SKILL[type].e} ${SKILL[type].n} · Ünite ${i+1} tamam! +5 ⭐`); }
  return {pts, bonus};
}
function skBack(){ const K = SKILL[sk.type]; return `<div class="row between"><a class="link" href="#${sk.type}">← ${K.n} · ${K.tr}</a><span class="chip">${K.e} Ünite ${sk.unit+1}: ${LEVELS[sk.unit].theme}</span></div>`; }
function skLocked(){ const i = sk.unit;
  return `${skBack()}<section class="panel"><div class="uhead"><span class="ic">🔒</span><div><div class="eyebrow">Ünite ${i+1}</div><h1>${LEVELS[i].theme}</h1></div></div>
    <p>Bu bölüm henüz kilitli. Önce <a class="link" href="#unit-${i}">Ünite ${i}: ${LEVELS[i-1].theme}</a> kolay testini bitir.</p></section>`; }
function skProg(total){ return `<div class="progress">${[...Array(total).keys()].map(n=>`<span class="${sk.local.has(n)?"done":n===sk.idx?"now":""}"></span>`).join("")}</div>`; }

function skillListHTML(type){
  const K = SKILL[type];
  const desc = {
    reading:"Kısa hikâyeleri oku, istersen Ollie'ye okut, sonra soruları cevapla. İlk denemede doğru cevap ⭐+5.",
    listening:"Ollie'yi dikkatle dinle ve doğru resmi seç. Önce metne bakmadan dene! İlk denemede doğru cevap ⭐+5.",
    speaking:"Cümleyi dinle, sonra 🎤 düğmesine basıp sen söyle. Ollie seni dinler ve hangi kelimeleri doğru söylediğini gösterir. Her cümle ⭐+5."
  }[type];
  const note = type==="speaking" && !SR ? `<div class="fb try">Bu tarayıcı konuşmayı dinleyemiyor. Chrome, Edge ya da Safari'de Ollie sesini kontrol eder. Burada da çalışabilirsin: cümleyi yüksek sesle söyleyip "I said it!" düğmesine bas.</div>` : "";

    ${type==="speaking" ? `<div class="continue" style="margin-top:12px"><span class="ic">🦉</span><div class="txt"><div class="eyebrow">Yeni · Talk with Ollie</div><h3>Ollie ile serbest sohbet</h3><span class="tr">Cümleleri tekrar etmenin ötesine geç: Ollie'ye bir şey söyle, o da sana cevap versin.</span></div><a class="btn" href="#chat">Sohbet ▶</a></div>` : ""}
    ${type==="reading" ? `<div class="continue" style="margin-top:12px"><span class="ic">📚</span><div class="txt"><div class="eyebrow">Yeni · Okuma Kütüphanesi</div><h3>${BOOKS.length} resimli kitap, ${bookLevels().length} seviye</h3><span class="tr">${bookCount()} kitap okudun. Ünite hikâyelerinden sonra seviyene uygun kitaplarla devam et.</span></div><a class="btn" href="#library">Kütüphane ▶</a></div>` : ""}</section>
  <div class="grid g3">${LEVELS.map((L,i)=>{ const open = unitOpen(i), n = skDone(type,i).length, tot = K.total(i), done = n >= tot;
    const nm = type==="reading" ? READING[i].title : L.theme;
    const st = !open ? `<span class="chip">🔒 Kilitli</span>` : done ? `<span class="chip ok">✓ Tamam</span>` : n ? `<span class="chip">Devam ediyor</span>` : `<span class="chip">Yeni</span>`;
    return `<a class="unit ${open?"":"locked"}" href="#${type}-${i+1}" ${open?"":'aria-disabled="true"'}>
      <div class="top"><span class="ic">${type==="reading"?READING[i].e:L.icon}</span><div style="min-width:0"><div class="no">Ünite ${i+1}${type==="reading"?" · "+L.theme:""}</div><div class="nm">${esc(nm)}</div><div class="tr">${tot} ${K.unitName==="hikâye"?"soru":K.unitName}</div></div></div>
      <div class="bar"><i style="width:${Math.round(n/tot*100)}%"></i></div>
      <div class="meta"><span>${st}</span><span>${n}/${tot}</span></div></a>`; }).join("")}</div>`;
